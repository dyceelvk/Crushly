# Crushly media Worker — the only door to the private media bucket.
#
# Deployed by .github/workflows/deploy-worker.yml on every push that touches
# this directory. All configuration arrives as Worker secrets at deploy time,
# from GitHub Actions secrets — nothing sensitive is ever committed here.

name = "crushly-media"
main = "src/index.ts"
compatibility_date = "2026-10-09"

# Secrets injected at deploy time:
#   SUPABASE_URL          https://<ref>.supabase.co        (same project as the app)
#   SUPABASE_ANON_KEY     the app's publishable/anon key   (never the service key)
#   B2_KEY_ID             Backblaze application key ID
#   B2_APPLICATION_KEY    Backblaze application key
#   B2_BUCKET             the private bucket name, e.g. crushly-media
#
# The Android APK lives in R2, not in B2: 97 MB per install is metered egress on
# B2 and that allowance ran out. It is filled by publish-android.yml.
# The APK's home. The bucket is `holupp` — it already existed (created by hand on
# 2026-11-11), so this is the real name, not a name we chose and then asked for.
# The Worker streams from here without an egress bill.
# If the binding is ever removed the Worker falls back to the public release
# channel, so commenting it out is a safe way to take R2 out of the path.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "holupp"
# Member media, in its own bucket on purpose: a retention rule written for the
# APK must never be able to expire somebody's photo, and 97 MB of app should not
# be sitting among the pictures.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "holupp-media"

# Served from the Worker's own *.workers.dev address today. Adding a custom
# domain later needs no code change and no stored URL changes: the old address
# keeps working alongside the new one.

# The clip-marking job runs in GitHub Actions (it needs ffmpeg). GitHub treats a
# five-minute schedule on a quiet repository as a suggestion and fires it a handful of
# times a day, which is how a posted clip ends up with no marked copy for hours
# and the share sheet says "still being prepared". This cron is a real one.
# The dispatch needs MARK_DISPATCH_TOKEN as a secret; without it the tick is a
# no-op and the GitHub schedule stays the only trigger.
[triggers]
crons = ["*/5 * * * *"]
