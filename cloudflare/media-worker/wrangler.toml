# Crushly media Worker — the only door to the private media bucket.
#
# Deployed by .github/workflows/deploy-worker.yml on every push that touches
# this directory. All configuration arrives as Worker secrets at deploy time,
# from GitHub Actions secrets — nothing sensitive is ever committed here.

name = "crushly-media"
main = "src/index.ts"
compatibility_date = "2026-10-09"

# Secrets injected at deploy time:
#   SUPABASE_URL          https://<ref>.supabase.co        (same project as the app)
#   SUPABASE_ANON_KEY     the app's publishable/anon key   (never the service key)
#   B2_KEY_ID             Backblaze application key ID
#   B2_APPLICATION_KEY    Backblaze application key
#   B2_BUCKET             the private bucket name, e.g. crushly-media
#
# The Android APK lives here, not in B2. `holup-releases` is a private R2 bucket
# bound to this Worker as `RELEASES`; see src/index.ts::downloadRelease for why
# (97 MB per install is metered egress on B2, and that allowance ran out).
# The bucket is created by .github/workflows/deploy-worker.yml if it is missing,
# and filled by .github/workflows/publish-android.yml.
# R2 is the intended home for the APK, but enabling R2 needs the R2 subscription
# switched on in the Cloudflare account first (and that checkout wants a card).
# Until it is, the binding is commented out rather than left dangling: a Worker
# that binds to a bucket which does not exist fails to deploy *entirely*, which
# would take the media pipeline and the update channel down with it.
# Re-enable these two lines — and nothing else — once the bucket exists.
# [[r2_buckets]]
# binding = "RELEASES"
# bucket_name = "holup-releases"

# Served from the Worker's own *.workers.dev address today. Adding a custom
# domain later needs no code change and no stored URL changes: the old address
# keeps working alongside the new one.
