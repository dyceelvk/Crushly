# Netlify deployment for the Crushly web app (Expo web export).
#
# !! WARNING: do NOT add [build] base and never make publish/base relative.
# !! With base set, git builds resolve publish twice and fail instantly.
# !! Keep every path repo-root relative (proven working config).
#
# Site settings to set in the Netlify UI:
#   - Production branch: arena/927d4af8-crushly
#     (main only holds the archive zip until the final merge — building main
#     publishes an empty site and every URL 404s.)
#   - Environment variables:
#       EXPO_PUBLIC_SUPABASE_URL       your Supabase project URL
#       EXPO_PUBLIC_SUPABASE_ANON_KEY  your Supabase anon (public) key
#
# All paths below are relative to the repository root on purpose: there is no
# [build] base, so Netlify's base/publish resolution can't hide the dist/ folder.

[build]
  command = "bash build.sh"   # cwd-agnostic: finds the app whether Netlify starts at the root or inside CrushlyApp
  publish = "CrushlyApp/dist"

[build.environment]
  NODE_VERSION = "22"

# The APK is not served from here: Netlify does not proxy to another host on
# this plan, so the build is streamed by the media Worker instead and the page
# links there. Neither the repository nor the storage bucket appears in it.

# Serve the download page before the app's single-page fallback.
[[redirects]]
  from = "/download"
  to = "/download/"
  status = 301

[[redirects]]
  from = "/download/"
  to = "/download/index.html"
  status = 200

# Single-page app: let the browser router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output can be cached forever; index.html must stay fresh.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
