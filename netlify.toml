# Netlify deployment for the Crushly web app (Expo web export).
#
# Note on paths: the site's stored build settings have `base: CrushlyApp` with
# publish relative to base — this file matches that, so both Netlify's own git
# builds and the GitHub Actions deploy resolve the same, correct paths.
#
# Site settings you may set in the Netlify UI:
#   - Environment variables (only needed for Netlify's own git builds; the
#     GitHub Actions deploy bakes them from GitHub secrets):
#       EXPO_PUBLIC_SUPABASE_URL       your Supabase project URL
#       EXPO_PUBLIC_SUPABASE_ANON_KEY  your Supabase publishable/anon key
#
# One-time settings: see README "Deploy for real" and the Quick links table.

[build]
  base = "CrushlyApp"
  command = "npm ci --include=dev && npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let the browser router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output can be cached forever; index.html must stay fresh.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
