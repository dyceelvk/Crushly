# Builds the Expo web export and deploys it to Netlify — every secret lives in
# GitHub, so the site config is one place to manage.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   https://github.com/dyceelvk/Crushly/settings/secrets/actions
#
#   NETLIFY_AUTH_TOKEN           Netlify → https://app.netlify.com/user/applications
#                                → Applications → Personal access tokens →
#                                New access token (any name, e.g. "github-actions").
#   NETLIFY_SITE_ID              Netlify → Site configuration → General →
#                                Site ID  (mencrushly: 9524369e-5044-4562-b504-3a62456403e9)
#   EXPO_PUBLIC_SUPABASE_URL     Supabase → Project Settings → API → Project URL
#                                (the bare https://<ref>.supabase.co)
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  Supabase → Settings → API Keys → Publishable key
#                                (sb_publishable_…), or Legacy API keys tab → anon public.
#                                NEVER the sb_secret_/service_role key.
#
#   Verification (see README "Identity verification (Didit)" + "Admin AI assist"):
#   DIDIT_API_KEY                Didit console (business.didit.me) → API & Webhooks → API Key
#   DIDIT_WORKFLOW_ID            Didit console → your workflow's ID
#   DIDIT_WEBHOOK_SECRET         Didit console → API & Webhooks → webhook destination secret
#   OPENAI_API_KEY               Admin-only AI review assist (platform.openai.com/api-keys)
#
# Never commit these values or paste them into chat.
#
# Pointing the pipeline at a DIFFERENT Netlify site (e.g. another account whose
# deploys are not blocked): create the site, copy the two EXPO_PUBLIC_* env
# vars onto it (Site configuration -> Environment variables), then update the
# NETLIFY_SITE_ID secret - nothing else in the repo changes. The site URL,
# Supabase Site URL and email links are resolved from the API on every run.
# Runbook: README.md "Switch the live site to another Netlify account".
#
# Runs on every push to the main line, or manually from the Actions tab.
#
# Deploys: Netlify's own git integration (auto publishing) is the single
# deployer — leave it ON (Site configuration → Build & deploy). The workflow's
# CLI deploy only runs when no git build exists for the pushed commit. Every
# deploy costs build credits (~15 each on the credit plan; 300 free/month), so
# the pipeline deliberately keeps to ONE deploy per push — do not re-add build
# hooks or parallel deploy steps.

name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main, arena/**]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Netlify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json

      - name: Check secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for v in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — add them under Settings → Secrets and variables → Actions (see .github/workflows/deploy-web.yml for where to find each value)."
            echo "::notice::Primary deploys still happen via Netlify's git integration on every push. To make Actions-side deploys work, replace NETLIFY_AUTH_TOKEN with a token that includes the Deploys scope (see annotations)."
          fi

      # Wires Gmail as the confirmation-email sender + auth URLs via the
      # Supabase Management API (idempotent; runs on every deploy).
      # Needs secrets: SUPABASE_ACCESS_TOKEN, GMAIL_SMTP_USER, GMAIL_SMTP_PASS.
      - name: Wire Gmail confirmation (SMTP + auth URLs)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${GMAIL_SMTP_USER:-}" ] || [ -z "${GMAIL_SMTP_PASS:-}" ]; then
            echo "::notice::Gmail confirmation not wired yet (optional, takes 2 min): add secrets SUPABASE_ACCESS_TOKEN + GMAIL_SMTP_USER + GMAIL_SMTP_PASS - steps in README 'Gmail confirmation emails'."
            exit 0
          fi
          # Resolve the deploy target so Supabase Site URL + email links follow
          # whichever site NETLIFY_SITE_ID points at (works across accounts).
          site_url=$(curl -s -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN:-}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID:-}" | jq -r '.ssl_url // empty' 2>/dev/null || true)
          [ -n "$site_url" ] || site_url="https://mencrushly.netlify.app"
          export SITE_URL="$site_url"
          echo "::notice::Deploy target site: $site_url (Supabase Site URL + email links follow this automatically)"
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          PROJECT = "yzcssyebozfkmojqqdhc"
          URL = f"https://api.supabase.com/v1/projects/{PROJECT}/config/auth"
          tok = os.environ["SUPABASE_ACCESS_TOKEN"]
          gmail = os.environ["GMAIL_SMTP_USER"]
          gpas = os.environ["GMAIL_SMTP_PASS"]

          def call(method, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(URL, data=data, method=method, headers={
                  "Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read() or b"{}")
                  except Exception:
                      return e.code, {}

          def scrub(text):
              return str(text).replace(gpas, "***")

          status, cfg = call("GET")
          if status >= 300:
              print(f"::warning::Supabase auth-config GET failed HTTP {status} - is SUPABASE_ACCESS_TOKEN valid and fresh? Create one at https://supabase.com/dashboard/account/tokens")
              sys.exit(0)

          payload = {
              "external_email_enabled": True,
              "mailer_autoconfirm": False,          # Confirm email stays ON
              "smtp_admin_email": gmail,
              "smtp_host": "smtp.gmail.com",
              "smtp_port": "465",  # string per API schema
              "smtp_user": gmail,
              "smtp_pass": gpas,
              "smtp_sender_name": "Crushly",
          }
          site_url = os.environ.get("SITE_URL", "https://mencrushly.netlify.app")
          if "site_url" in cfg:
              payload["site_url"] = site_url
          if "uri_allow_list" in cfg:
              payload["uri_allow_list"] = f"{site_url}/**,http://localhost:8081/**"
          elif "additional_redirect_urls" in cfg:
              payload["additional_redirect_urls"] = [f"{site_url}/**", "http://localhost:8081/**"]

          status, out = call("PATCH", payload)
          if status >= 300:
              print(f"::warning::SMTP config PATCH failed HTTP {status}: {scrub(json.dumps(out)[:400])} - fall back to the dashboard steps in the README.")
              sys.exit(0)

          status, cfg2 = call("GET")
          ok = (cfg2.get("smtp_host") == "smtp.gmail.com" and cfg2.get("mailer_autoconfirm") is False)
          if not ok:
              print("::warning::PATCH succeeded but the config did not stick - check Authentication -> SMTP settings in the Supabase dashboard.")
          else:
              print(f"::notice::Gmail confirmation wired: smtp.gmail.com:465 sender {gmail}, Confirm email ON, Site URL {site_url}. Signup + password-reset emails now go out via Gmail.")
              # Brand the confirm-signup email: Crushly logo + OTP code hero (no link).
              try:
                  t_keys = [k for k in cfg2 if k.startswith("mailer_templates") or k.startswith("mailer_subjects")]
                  print(f"::notice::Template API keys seen: {sorted(t_keys)}")
                  if "mailer_templates_confirmation_content" in cfg2:
                      html = open(os.path.join(os.environ["GITHUB_WORKSPACE"], "supabase/email-templates/confirm-signup.html"), encoding="utf-8").read()
                      recovery = open(os.path.join(os.environ["GITHUB_WORKSPACE"], "supabase/email-templates/recovery.html"), encoding="utf-8").read()
                      # Point every link/logo at whichever site we are deploying to.
                      html = html.replace("https://mencrushly.netlify.app", site_url)
                      recovery = recovery.replace("https://mencrushly.netlify.app", site_url)
                      t_payload = {
                          "mailer_templates_confirmation_content": html,
                          "mailer_subjects_confirmation": "{{ .Token }} is your Crushly code",
                          "mailer_templates_recovery_content": recovery,
                          "mailer_subjects_recovery": "{{ .Token }} is your Crushly reset code",
                      }
                      t_status, t_out = call("PATCH", t_payload)
                      if t_status < 300:
                          _, cfg3 = call("GET")
                          if "crushly-mark.png" in (cfg3.get("mailer_templates_confirmation_content") or ""):
                              print("::notice::Confirm-signup email template LIVE: Crushly logo + 6-digit code (subject shows the code). Source: supabase/email-templates/confirm-signup.html.")
                          else:
                              print("::warning::Template PATCH returned 2xx but the stored template does not look like ours - check Authentication -> Email Templates.")
                      else:
                          print(f"::warning::Template PATCH failed HTTP {t_status}: {scrub(json.dumps(t_out)[:300])} - paste supabase/email-templates/confirm-signup.html into Authentication -> Email Templates instead.")
                  else:
                      print(f"::warning::No mailer_templates_confirmation_content in auth config - paste supabase/email-templates/confirm-signup.html into Authentication -> Email Templates. Keys: {sorted(t_keys)}")
              except Exception as e:
                  import os, traceback
                  traceback.print_exc()
                  print(f"::warning::Template step crashed: {scrub(repr(e))} | cwd={os.getcwd()} | supabase dir: {os.listdir('supabase') if os.path.isdir('supabase') else 'MISSING'}")
          PY

      # Identity verification: Didit runs the member flow (hosted sessions +
      # signed webhooks); the AI reviewer is an ADMIN-ONLY assist for manual
      # review. Pushes the secrets into the project and deploys the edge
      # functions (idempotent; runs on every deploy).
      - name: Deploy verification (Didit + admin AI)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
          DIDIT_WEBHOOK_SECRET: ${{ secrets.DIDIT_WEBHOOK_SECRET }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::Verification deploy skipped - add the SUPABASE_ACCESS_TOKEN secret (https://supabase.com/dashboard/account/tokens)."
            exit 0
          fi
          site_url=$(curl -s -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN:-}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID:-}" | jq -r '.ssl_url // empty' 2>/dev/null || true)
          [ -n "$site_url" ] || site_url="https://crushlyi.netlify.app"

          wired=""
          push_secret() {
            name="$1"; value="$2"
            [ -n "$value" ] || { echo "::notice::$name not set - skipping."; return 0; }
            # The Management API takes an ARRAY of {name, value}; jq builds it
            # safely even when the value contains quotes or special characters.
            body=$(jq -n --arg n "$name" --arg v "$value" '[{name: $n, value: $v}]')
            code=$(curl -s -o /tmp/sec.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/yzcssyebozfkmojqqdhc/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$body")
            if [ "${code:0:1}" = "2" ] || grep -qi "already exist" /tmp/sec.json 2>/dev/null; then
              wired="$wired $name"
            else
              echo "::warning::Could not push $name (HTTP $code): $(head -c 300 /tmp/sec.json). Add it manually: https://supabase.com/dashboard/project/yzcssyebozfkmojqqdhc/functions/secrets"
            fi
          }
          push_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          push_secret DIDIT_API_KEY "$DIDIT_API_KEY"
          push_secret DIDIT_WORKFLOW_ID "$DIDIT_WORKFLOW_ID"
          push_secret DIDIT_WEBHOOK_SECRET "$DIDIT_WEBHOOK_SECRET"
          push_secret APP_URL "$site_url"
          # One summary notice: GitHub drops step notices past 10, so per-secret
          # notices would silently vanish on busy runs.
          [ -n "$wired" ] && echo "::notice::Secrets wired into the project:$wired"

          if [ -z "${DIDIT_API_KEY:-}" ] || [ -z "${DIDIT_WORKFLOW_ID:-}" ]; then
            echo "::warning::Didit not fully configured - members cannot start verification yet. Add DIDIT_API_KEY + DIDIT_WORKFLOW_ID at https://github.com/dyceelvk/Crushly/settings/secrets/actions and finish the runbook in README 'Identity verification (Didit)'."
          else
            echo "::notice::Didit member verification wired. Webhook for the Didit console: https://yzcssyebozfkmojqqdhc.supabase.co/functions/v1/didit-webhook"
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::notice::No OPENAI_API_KEY - the admin AI assist (npm run admin -- ai-assist) stays off until it is added."
          else
            echo "::notice::OPENAI_API_KEY wired - the AI review assist is available to administrators only (npm run admin -- ai-assist)."
          fi

          # Live probes: prove the wiring before members hit it.
          if [ -n "${DIDIT_API_KEY:-}" ] && [ -n "${DIDIT_WORKFLOW_ID:-}" ]; then
            probe=$(curl -s -o /tmp/probe.json -w "%{http_code}" \
              -H "x-api-key: $DIDIT_API_KEY" \
              "https://verification.didit.me/v3/workflows/$DIDIT_WORKFLOW_ID")
            if [ "$probe" = "200" ]; then
              echo "::notice::Didit probe OK: API key + workflow are valid (GET /v3/workflows/{id} -> 200)."
            else
              echo "::warning::Didit probe FAILED (HTTP $probe): $(head -c 300 /tmp/probe.json) - use the PRIMARY key from the SAME application as the workflow, and make sure the workflow is published."
            fi

            # Session-creation probe: the exact call didit-session makes (throwaway
            # session, deleted right after — sandbox sessions are free). The 1x1
            # PNG stands in for the member's profile photo (portrait_image).
            sres=$(curl -s -o /tmp/sess.json -w "%{http_code}" -X POST \
              "https://verification.didit.me/v3/session/" \
              -H "x-api-key: $DIDIT_API_KEY" -H "Content-Type: application/json" \
              -d "{\"workflow_id\": \"$DIDIT_WORKFLOW_ID\", \"vendor_data\": \"ci-probe\", \"callback\": \"$site_url/?didit=done\", \"callback_method\": \"both\", \"language\": \"en\", \"contact_details\": {\"email\": \"ci-probe@crushly.app\"}, \"metadata\": {\"probe\": true}, \"portrait_image\": \"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==\"}")
            if [ "${sres:0:1}" = "2" ]; then
              sid=$(jq -r '.session_id // empty' /tmp/sess.json)
              echo "::notice::Session probe OK: POST /v3/session/ created a throwaway session (HTTP $sres)."
              [ -n "$sid" ] && curl -s -o /dev/null -X DELETE -H "x-api-key: $DIDIT_API_KEY" "https://verification.didit.me/v3/session/$sid/delete/"
            else
              echo "::warning::Session probe FAILED (HTTP $sres): $(head -c 400 /tmp/sess.json) - this is the exact call didit-session makes; if the key/workflow probes passed, the workflow is likely NOT PUBLISHED in the Didit console."
            fi
          fi
          schema=$(curl -s -o /tmp/schema.json -w "%{http_code}" \
            -H "apikey: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" \
            -H "Authorization: Bearer ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" \
            "https://yzcssyebozfkmojqqdhc.supabase.co/rest/v1/verification_requests?select=didit_session_id&limit=1")
          if [ "$schema" = "200" ]; then
            echo "::notice::Schema probe OK: the Didit columns are live (verification_requests.didit_session_id answers)."
          else
            echo "::warning::Schema probe FAILED (HTTP $schema): $(head -c 300 /tmp/schema.json) - run the Deploy database migrations workflow (https://github.com/dyceelvk/Crushly/actions/workflows/db-migrations.yml)."
          fi

          echo "--- deploying edge functions ---"
          deployed=""
          for fn in verify-identity didit-session didit-status didit-webhook; do
            if out=$(cd "$GITHUB_WORKSPACE" && npx --yes supabase@latest functions deploy "$fn" --project-ref yzcssyebozfkmojqqdhc 2>&1); then
              deployed="$deployed $fn"
            else
              safe=$(printf '%s' "$out" | sed -e "s/$OPENAI_API_KEY/***/g" -e "s/$DIDIT_API_KEY/***/g" -e "s/$DIDIT_WEBHOOK_SECRET/***/g")
              echo "::warning::functions deploy $fn failed: $(printf '%s' "$safe" | tail -c 500 | tr '\n' ' ')"
            fi
          done
          [ -n "$deployed" ] && echo "::notice::Edge functions deployed:$deployed"

      - name: Install & test
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:web

      - name: Diagnose Netlify access
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          code=$(curl -s -o /tmp/site.json -w "%{http_code}" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          name=$(jq -r '.name // "??"' /tmp/site.json 2>/dev/null || echo "??")
          echo "Netlify site lookup: HTTP $code (name: $name)"
          case "$code" in
            200)
              echo "::notice::Netlify token can access site '$name'." ;;
            401)
              echo "::error::Netlify rejected NETLIFY_AUTH_TOKEN (401 Unauthorized): the token is invalid, mistyped or revoked. Create a fresh Personal access token at https://app.netlify.com/user/applications (logged in as the account that owns the mencrushly site) and update the secret." ;;
            403)
              echo "::error::NETLIFY_AUTH_TOKEN is valid but has NO access to this site (403 Forbidden) — it was almost certainly created on a different Netlify account/team than the one that owns mencrushly. Log into THAT account (the one showing the mencrushly site), create the token at https://app.netlify.com/user/applications, and update the secret." ;;
            404)
              echo "::error::Site not found (404) — NETLIFY_SITE_ID is wrong, or the token's account cannot see that site. Use the Site ID from Netlify → Site configuration → General (Site information) of the account that OWNS the site you want to deploy to." ;;
            *)
              echo "::error::Unexpected Netlify API response: HTTP $code — $(head -c 300 /tmp/site.json)" ;;
          esac
          [ "$code" = "200" ] || exit 1

          # What is the site actually serving vs our latest commit?
          pub=$(jq -r '.published_deploy.commit_ref // "none"' /tmp/site.json 2>/dev/null)
          pubt=$(jq -r '.published_deploy.title // "?"' /tmp/site.json 2>/dev/null | cut -c1-40)
          pubc=$(jq -r '.published_deploy.created_at // "?"' /tmp/site.json 2>/dev/null)
          pubctx=$(jq -r '.published_deploy.context // .published_deploy.deploy_context // "?"' /tmp/site.json 2>/dev/null)
          head=$(git rev-parse --short=7 HEAD)
          echo "site serves commit: ${pub:0:7} ("$pubt" at $pubc, context: $pubctx) - our HEAD: $head"
          if [ "$pubctx" != "production" ] && [ "$pubctx" != "?" ]; then
            echo "::warning::The LIVE site is serving a $pubctx deploy, not the production build - if the app shows 'Backend not connected', a preview build (which can miss production-scoped env vars) was promoted. Republish the last production deploy, or fix the env-var contexts and redeploy."
          fi

          # Env-var deploy contexts: deploy previews only inherit variables that
          # carry a deploy-preview (or all-context) value. Production-only values
          # leave preview builds showing "Backend not connected". Values masked.
          echo "::notice::Site env vars (values masked): $(jq -r '[.build_settings.env // {} | to_entries[] | "\(.key)=\(if (.value | type) == "object" then (.value | keys | join("/")) else "value" end)"] | join("  ")' /tmp/site.json 2>/dev/null)"
          acct_id=$(jq -r '.account_id // empty' /tmp/site.json 2>/dev/null)
          # Shared (team-level) env vars — the EXPO_PUBLIC_* pair lives here, not
          # on the site. Values are stripped; only keys/scopes/contexts print.
          for scope in "site_id=$NETLIFY_SITE_ID" ""; do
            curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/accounts/$acct_id/env${scope:+?$scope}" \
              | jq -r 'if type == "array" then .[] | select(.key | startswith("EXPO_PUBLIC_")) | "env: \(.key) scopes=\(.scopes | join(",")) contexts=\([.values[]?.context] | join(","))" else empty end' 2>/dev/null \
              | sed 's/^/::notice::/' || true
          done
          if [ "${pub:0:7}" != "$head" ]; then
            echo "::notice::LIVE site serves an OLDER deploy (site=${pub:0:7}, HEAD=$head) - if the app looks unchanged: turn ON Netlify auto publishing (Site configuration -> Build & deploy -> Continuous deployment) or give NETLIFY_AUTH_TOKEN the Deploy scope."
          else
            echo "::notice::The live site is serving our latest commit."
          fi

          # Which accounts/roles can this token see? (Developer/Owner deploys, Viewer cannot)
          curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/accounts" \
            | jq -r '.[] | "account: \(.name) (id \(.id)) — role: \(.role_slug // .type_name // "?")"' 2>/dev/null \
            | sed 's/^/::notice::/' || true

          # Write probe: no-op site update (name set to its current value).
          # A read-only token gets 403 here even though GET worked.
          wc=$(curl -s -o /tmp/wprobe.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\": \"$name\"}" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          echo "write probe: HTTP $wc — $(head -c 300 /tmp/wprobe.json)"
          case "$wc" in
            2*)
              echo "::notice::Token CAN write to the site - it is not read-only. If the deploy still fails 403, the missing permission is deploy-specific." ;;
            401|403)
              echo "::error::Token is READ-ONLY (write probe HTTP $wc: $(head -c 300 /tmp/wprobe.json)). Create a NEW Personal access token at https://app.netlify.com/user/applications in the 'Personal access tokens' section (NOT OAuth applications, NOT a scoped/read-only or Team access token), then update the NETLIFY_AUTH_TOKEN secret." ;;
            *)
              echo "::warning::Write probe returned HTTP $wc - $(head -c 200 /tmp/wprobe.json)" ;;
          esac

      # Read-only deploy diagnostics. Netlify's git integration (auto publishing)
      # is the primary deployer — one deploy per push. This step only LISTS
      # deploys and surfaces errors; it deliberately does NOT trigger builds:
      # every deploy costs build credits, and triple-deploying per push burned
      # through a fresh account's 300 free credits in a few hours.
      - name: Diagnose Netlify deploys
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          # Resolve the target site (works whichever account owns it).
          site_json=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          site_name=$(printf '%s' "$site_json" | jq -r '.name // "mencrushly"')
          site_url=$(printf '%s' "$site_json" | jq -r '.ssl_url // "https://mencrushly.netlify.app"')
          echo "::notice::Deploying to Netlify site '$site_name' ($site_url)"

          curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=5" \
            | jq -r '.[] | "recent deploy: \(.state) \(.commit_ref[0:7] // "none") \"\(.title // "" | .[0:30])\" \(.created_at)"' 2>/dev/null \
            | sed 's/^/::notice::/' || true

          # If the newest build failed, pull its log and surface the real error.
          latest=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=1")
          dep_id=$(printf '%s' "$latest" | jq -r '.[0].id // empty')
          dep_state=$(printf '%s' "$latest" | jq -r '.[0].state // empty')
          log_url=$(printf '%s' "$latest" | jq -r '.[0].log_access_address // empty')
          if [ -z "$log_url" ] && [ -n "$dep_id" ]; then
            log_url=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/deploys/$dep_id" | jq -r '.log_access_address // empty')
          fi
          echo "::notice::deploy=$dep_id state=$dep_state log_url_set=$([ -n "$log_url" ] && echo yes || echo no)"
          if [ -n "$dep_id" ]; then
            curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/deploys/$dep_id" \
              | jq -r '"deploy detail: state=\(.state) error_message=\(.error_message // "none") summary=\(.summary // "none") cause=\(.cause // "none")"' \
              | cut -c1-320 | sed 's/^/::warning::/' || true
          fi
          if [ "$dep_state" = "error" ]; then
            echo "::warning::Latest Netlify build FAILED - full log: https://app.netlify.com/sites/$site_name/deploys/$dep_id"
            if [ -n "$log_url" ]; then
              curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$log_url" \
                | grep -iE "error|failed|cannot|not found|out of memory|killed|bad option|unsupported|engines" \
                | tail -6 | cut -c1-280 | sed 's/^/::warning::log: /' || true
            fi
          fi

          # Node is pinned to 22 in netlify.toml (the git builds honor it).
          # The deploy above (auto publishing) is the single deployer — no build
          # hook here: every extra build costs credits.

      # Actions-side deployer — only when Netlify's own git integration did NOT
      # already build this commit. Every deploy costs build credits, so with
      # auto publishing ON this step stays idle (one deploy per push, total).
      - name: Deploy to Netlify (only if git auto-publish is off)
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          head_short=$(git rev-parse --short=7 HEAD)
          has_git_build=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=10" \
            | jq -r --arg h "$head_short" '[.[] | select(((.commit_ref // "")[0:7]) == $h)] | length')
          if [ "${has_git_build:-0}" -gt 0 ]; then
            echo "::notice::Git auto-publish already built $head_short - skipping the CLI deploy (one deploy per push saves build credits)."
            exit 0
          fi
          echo "::notice::No git build for $head_short (auto publishing off?) - deploying via CLI."
          # From the repo root: netlify.toml (and build.sh) live there, and the
          # site's configured build command resolves relative to it.
          cd "$GITHUB_WORKSPACE"
          if ! out=$(npx --yes netlify-cli@latest deploy --prod --dir=CrushlyApp/dist --message="Deploy ${{ github.sha }}" --debug 2>&1); then
            # Mask the token value itself, whatever it looks like.
            safe_out=${out//$NETLIFY_AUTH_TOKEN/***}
            echo "::error::netlify deploy failed: $(printf '%s' "$safe_out" | tail -c 1400 | tr '\n' ' ')"
            printf '%s\n' "$safe_out" | tail -30
            exit 1
          fi
          printf '%s\n' "$out"
