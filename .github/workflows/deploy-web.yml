# Builds the Expo web export and deploys it to Vercel — every secret lives in
# GitHub, so the site config is one place to manage.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN            Vercel → https://vercel.com/account/tokens
#   EXPO_PUBLIC_SUPABASE_URL  Supabase → Project Settings → API → Project URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  Supabase → Settings → API Keys → Publishable key
#   SUPABASE_DB_URL           Supabase → Project Settings → Database → Session pooler URI
#
# Never commit these values or paste them into chat.
#
# Runs on every push to the main line or arena/**, or manually from the Actions tab.

name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main, arena/**]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Run database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client

      - name: Pre-flight — can we reach the database at all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          out=$(psql "$SUPABASE_DB_URL" -tAc "select current_database(), version();" 2>&1)
          rc=$?
          echo "psql exit code: $rc"
          echo "psql said: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-400)"
          if [ "$rc" != "0" ]; then
            echo "::error::Cannot reach the database with SUPABASE_DB_URL."
            exit 1
          fi

      - name: Apply load_post migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261028000027_load_post.sql
          echo "::notice::Migration 20261028000027_load_post.sql applied successfully."

  deploy:
    name: Build & deploy to Vercel
    needs: database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/check-public-build.mjs
          npm run build:web

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/CrushlyApp"
          npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN" --message="Deploy ${{ github.sha }}"
