# Builds the Expo web export and deploys it to Vercel — every secret lives in
# GitHub, so the site config is one place to manage.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN            Vercel → https://vercel.com/account/tokens
#   EXPO_PUBLIC_SUPABASE_URL  Supabase → Project Settings → API → Project URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  Supabase → Settings → API Keys → Publishable key
#   SUPABASE_DB_URL           Supabase → Project Settings → Database → Session pooler URI
#
# Never commit these values or paste them into chat.
#
# Runs on every push to the main line or arena/**, or manually from the Actions tab.

name: Deploy web app

on:
  workflow_dispatch:
  # `app/**` is included deliberately: the web app and the Worker are deployed
  # from this branch, and while only `main` and `arena/**` were listed a push
  # here silently deployed nothing. A release that publishes an APK while the
  # download page and the Worker that serves it still describe the previous one
  # is exactly the state that costs an hour of "why is it still 1.0.7".
  push:
    branches: [main, 'arena/**', 'app/**']

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Run database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client

      - name: Pre-flight — can we reach the database at all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          out=$(psql "$SUPABASE_DB_URL" -tAc "select current_database(), version();" 2>&1)
          rc=$?
          echo "psql exit code: $rc"
          echo "psql said: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-400)"
          if [ "$rc" != "0" ]; then
            echo "::error::Cannot reach the database with SUPABASE_DB_URL."
            exit 1
          fi

      # This step used to hand-apply one migration by filename. That filename
      # has since been renumbered to match what the database recorded, which
      # broke the deploy on a file that had already been applied years of
      # migrations ago. `Deploy database migrations` owns this now — it pushes
      # everything, in order, and knows what has run. A web deploy should not
      # be the thing that decides which migration matters.
      - name: Confirm this deploy needs no migration of its own
        run: echo "::notice::Schema is applied by the Deploy database migrations workflow; nothing to hand-apply here."

  deploy:
    name: Build & deploy to Vercel
    needs: database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/check-public-build.mjs
          npm run build:web

      # The build above is the check. This step is the deploy, and until now it
      # failed on every single push with `Error: You defined "--token", but
      # it's missing a value` — VERCEL_TOKEN was never added. A permanently red
      # check on a branch that people are told is green is worse than no check:
      # it teaches everyone to scroll past the one run that would have caught a
      # real failure.
      #
      # With no token this step now skips, loudly, and names the two ways to
      # actually deploy. With a token it deploys and verifies.
      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN is not set, so this workflow cannot publish the web app. Nothing is broken — the site is deployed by Vercel's own Git integration, and the build above still proves this commit compiles. To let this job deploy: create a token at https://vercel.com/account/tokens and add it as a repository secret named VERCEL_TOKEN."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/CrushlyApp"
          npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN" --message="Deploy ${{ github.sha }}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # A deploy that nobody confirms is a deploy you find out about from a
      # member. Ask the live site for the bundle it is serving and confirm the
      # controls this release is about are in it.
      - name: Confirm the live site serves this build
        if: steps.vercel.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          html=$(curl -sS --max-time 30 https://mecrushly.vercel.app/)
          bundle=$(printf '%s' "$html" | grep -oE '_expo/static/js/web/[A-Za-z0-9._-]+\.js' | sort -u | head -1)
          echo "live bundle: $bundle"
          curl -sS --max-time 60 "https://mecrushly.vercel.app/$bundle" -o /tmp/live.js
          for needle in save_post saved_posts; do
            if ! grep -q "$needle" /tmp/live.js; then
              echo "::error::The live bundle does not contain ${needle}, so the site is not serving this release."
              exit 1
            fi
          done
          echo "::notice::mecrushly.vercel.app is serving this build."
