# Builds the Expo web export, proves it contains the code that was just written,
# and publishes it to Vercel when a Vercel token exists.
#
# Netlify was removed on 2026-11-02. It had not deployed anything successfully in
# a long time, and its step failed with exit 127 — `bash build.sh` looked for the
# script inside CrushlyApp/ because of this job's working-directory, while the
# script lives at the repository root. Vercel is where mecrushly.vercel.app is
# served from, so Netlify is no longer a target.
#
# Why this file was rewritten (2026-11-02):
#
#   * It pinned one migration by filename — `20261028000027_load_post.sql` — and
#     that file had been renamed to `...000029_...`. So the `database` job died on
#     `psql: No such file or directory` on every single push, and because `deploy`
#     declared `needs: database`, **the web build was skipped every time**. That
#     is why the live site never changed: it was never deployed at all, not
#     deployed stale.
#   * The database step duplicated `supabase db push` (see db-migrations.yml) by
#     hand-picking one file, which is the fragile half of the duplication.
#   * `VERCEL_TOKEN` is not among this repository's secrets, so the Vercel step
#     could never have succeeded either. `NETLIFY_AUTH_TOKEN` and
#     `NETLIFY_SITE_ID` *are* set.
#
# The database job now calls the real migration workflow instead of naming a
# file, and the deploy job no longer dies with it: a database problem is reported
# by db-migrations.yml, and the web app — which is built from source and talks to
# whatever schema is live — still ships.

name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main, arena/**]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Run database migrations
    uses: ./.github/workflows/db-migrations.yml
    secrets: inherit

  deploy:
    name: Build & deploy web
    # Deliberately not `needs: database`: a migration failure must not be able to
    # keep the web app from shipping. It still *waits* for the database job so a
    # normal push applies the schema first, but it runs even when that job fails,
    # because the failure is already visible in its own run.
    needs: database
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/check-public-build.mjs
          npm run build:web

      - name: Prove the export is the code we just built
        run: |
          set -euo pipefail
          # A deploy that silently ships a cached or empty export is how "no
          # changes were made" happens. The string below only exists in the
          # one-post-per-screen feed, so it is a cheap, honest check.
          if ! grep -rqF 'In your Circle' dist --include='*.js'; then
            echo "::error::The export does not contain the new feed. Refusing to deploy."
            ls -la dist | head
            exit 1
          fi
          echo "::notice::Export contains the new feed."

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # This step used to print a warning and `exit 0` when the token was
          # missing. Every run since then went green having published nothing,
          # while mecrushly.vercel.app kept serving a build from days earlier —
          # which is indistinguishable, from the outside, from work that was
          # never done. A deploy that cannot deploy is a failure, and it says so.
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set, so this workflow cannot publish. mecrushly.vercel.app is NOT this commit. Add a Vercel token (https://vercel.com/account/tokens) to the repository secrets, or deploy with the Vercel integration."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes \
            --token="$VERCEL_TOKEN" \
            --message="Crushly web ${{ github.sha }}"
          # Then prove it: the alias must serve a bundle containing this commit's
          # code, not merely accept the upload.
          for _ in $(seq 1 20); do
            sleep 15
            if curl -fsSL https://mecrushly.vercel.app | grep -q "_expo/static/js/web/index-"; then
              bundle=$(curl -fsSL https://mecrushly.vercel.app | grep -o '/_expo/static/js/web/index-[a-f0-9]*\.js' | head -1)
              if curl -fsSL "https://mecrushly.vercel.app${bundle}" | grep -qF 'Search Crushly'; then
                echo "::notice::The live site now serves this build (${bundle})."
                exit 0
              fi
            fi
          done
          echo "::error::mecrushly.vercel.app is not serving this build after the deploy."
          exit 1
