# Builds the Expo web export, proves it contains the code that was just written,
# and publishes it to Vercel when a Vercel token exists.
#
# Netlify was removed on 2026-11-02. It had not deployed anything successfully in
# a long time, and its step failed with exit 127 — `bash build.sh` looked for the
# script inside CrushlyApp/ because of this job's working-directory, while the
# script lives at the repository root. Vercel is where holupapp.vercel.app is
# served from, so Netlify is no longer a target.
#
# Why this file was rewritten (2026-11-02):
#
#   * It pinned one migration by filename — `20261028000027_load_post.sql` — and
#     that file had been renamed to `...000029_...`. So the `database` job died on
#     `psql: No such file or directory` on every single push, and because `deploy`
#     declared `needs: database`, **the web build was skipped every time**. That
#     is why the live site never changed: it was never deployed at all, not
#     deployed stale.
#   * The database step duplicated `supabase db push` (see db-migrations.yml) by
#     hand-picking one file, which is the fragile half of the duplication.
#   * `VERCEL_TOKEN` is not among this repository's secrets, so the Vercel step
#     could never have succeeded either. `NETLIFY_AUTH_TOKEN` and
#     `NETLIFY_SITE_ID` *are* set.
#
# The database job calls the real migration workflow instead of naming a single
# file. A failed migration blocks the web deploy so a client that needs new RPCs
# cannot replace the working site before those RPCs exist. A separate Vercel
# Git integration can deploy independently, so releases still require the
# database to be migrated before pushing the app commit to its production branch.

name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main, arena/**]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Run database migrations
    uses: ./.github/workflows/db-migrations.yml
    secrets: inherit

  deploy:
    name: Build & deploy web
    # Search and banners require the new RPCs. Never ship a web client against
    # a database whose migration failed; a separately configured Vercel Git
    # integration must also be sequenced before the production branch push.
    needs: database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Public Turnstile site key. Blank is safe: the app then sends no
          # captcha token, which is the pre-captcha behaviour, not a broken build.
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          node scripts/check-public-build.mjs
          npm run build:web

      - name: Prove the export is the code we just built
        run: |
          set -euo pipefail
          # A deploy that silently ships a cached or empty export is how "no
          # changes were made" happens. Every guard string here is ASCII-only
          # and lives on a surface the app renders today, because a needle the
          # bundler legitimately drops blocks a *good* build: that already
          # happened once with 'In your Circle' and then again with the old
          # Crushes empty-state copy, which 1.0.65 rewrote.
          for needle in \
            'Where a Crush turns into a conversation.' \
            'Somebody will. A complete Space and a fresh Moment help you get noticed.' \
            'holUpp for Android' \
            'Moments disappear after 24 hours.'; do
            if ! grep -rqF "$needle" dist --include='*.js'; then
              echo "::error::The export does not contain '$needle'. Refusing to deploy."
              ls -la dist | head
              exit 1
            fi
          done
          size=$(find dist/_expo/static/js/web -name 'index-*.js' -printf '%s\n' | sort -n | tail -1)
          echo "::notice::Export contains the current surfaces; main bundle is ${size} bytes."

      # Same rule as the APK, on the export that is about to go public: the
      # browser can be read by anybody, so a server credential in this bundle is
      # strictly worse than one in an installed app.
      - name: Refuse to publish an export carrying a server secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WEBHOOK_SECRET: ${{ secrets.DIDIT_WEBHOOK_SECRET }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GMAIL_SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_SAFEGUARD_KEY: ${{ secrets.GROQ_SAFEGUARD_KEY }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A Vercel token in the browser is as bad as any of the above.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 ../.github/scripts/audit-apk-secrets.py dist "$RUNNER_TEMP/SECURITY-CHECK.txt"

      - name: Publish, then prove the live site is this build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('app.json'))['expo']['version'])")
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            npx --yes vercel@latest deploy --prod --yes \
              --token="$VERCEL_TOKEN" \
              --message="Crushly web ${{ github.sha }}"
          else
            # This repository has no VERCEL_TOKEN, and adding one is not this
            # job's decision to make. Publishing happens through the Vercel
            # integration; what this job owes is the part that was missing for
            # weeks: checking that the live site is actually the build. It used
            # to warn, exit 0 and go green with production a fortnight behind.
            echo "::notice::No VERCEL_TOKEN: assuming the Vercel integration publishes. Verifying the live site below."
          fi
          # The title is read from the build we just made, not typed in here, so
          # this check cannot rot when the copy changes.
          title=$(python3 -c "import re;print(re.search(r'<title>(.*?)</title>', open('dist/index.html').read(), re.S).group(1).strip())")
          python3 - "$version" "$title" <<'PY'
          import re, sys, time, urllib.request
          version, title = sys.argv[1], sys.argv[2]
          """
          Two checks, because one of them was not enough.

          This used to look for the app version inside the live bundle and call it
          proven. Every commit on the same version therefore passed against a
          *stale* site: on 2026-11-07 holupapp.vercel.app was eight commits behind,
          still serving the pre-rename bundle, and this job went green because
          1.0.95 was still 1.0.95. The commit that day was never shipped and
          nothing said so.

          The page's own <title> only changes when the build changes, so it is the
          cheap proof that the live document is this build and not an older one.
          """
          for attempt in range(20):
              try:
                  html = urllib.request.urlopen('https://holupapp.vercel.app', timeout=30).read().decode('utf-8', 'ignore')
                  live_title = re.search(r'<title>(.*?)</title>', html, re.S)
                  live_title = live_title.group(1).strip() if live_title else ''
                  bundle = re.search(r'/_expo/static/js/web/index-[a-f0-9]+\.js', html)
                  if bundle and live_title == title:
                      js = urllib.request.urlopen('https://holupapp.vercel.app' + bundle.group(0), timeout=90).read().decode('utf-8', 'ignore')
                      if re.search(r'version[^0-9]{0,12}' + re.escape(version), js):
                          print('::notice::holupapp.vercel.app is serving ' + version + ' (' + bundle.group(0) + ') with the title of this build')
                          sys.exit(0)
                      print('live bundle is not ' + version + ' yet (attempt ' + str(attempt + 1) + ')')
                  elif bundle:
                      print('live title is not this build yet: ' + repr(live_title) + ' (attempt ' + str(attempt + 1) + ')')
              except Exception as exc:
                  print('could not read the live site: ' + str(exc))
              time.sleep(15)
          print('::error::holupapp.vercel.app is not serving this build (' + repr(title) + '). This commit is not shipped until it is.')
          sys.exit(1)
          PY
