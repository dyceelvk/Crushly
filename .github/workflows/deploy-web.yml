# Builds the Expo web export and deploys it to Netlify — every secret lives in
# GitHub, so the site config is one place to manage.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   https://github.com/dyceelvk/Crushly/settings/secrets/actions
#
#   NETLIFY_AUTH_TOKEN           Netlify → https://app.netlify.com/user/applications
#                                → Applications → Personal access tokens →
#                                New access token (any name, e.g. "github-actions").
#   NETLIFY_SITE_ID              Netlify → Site configuration → General →
#                                Site ID  (mencrushly: 9524369e-5044-4562-b504-3a62456403e9)
#   EXPO_PUBLIC_SUPABASE_URL     Supabase → Project Settings → API → Project URL
#                                (the bare https://<ref>.supabase.co)
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  Supabase → Settings → API Keys → Publishable key
#                                (sb_publishable_…), or Legacy API keys tab → anon public.
#                                NEVER the sb_secret_/service_role key.
#
# Never commit these values or paste them into chat.
#
# Runs on every push to the main line, or manually from the Actions tab.
# If Netlify's own git builds are still on, turn them off (Site configuration →
# Build & deploy → your repository → "Stop auto publishing") so this workflow
# is the single deployer.

name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main, arena/**]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Netlify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json

      - name: Check secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for v in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — add them under Settings → Secrets and variables → Actions (see .github/workflows/deploy-web.yml for where to find each value)."
            echo "::notice::Primary deploys still happen via Netlify's git integration on every push. To make Actions-side deploys work, replace NETLIFY_AUTH_TOKEN with a token that includes the Deploys scope (see annotations)."
          fi

      # Wires Gmail as the confirmation-email sender + auth URLs via the
      # Supabase Management API (idempotent; runs on every deploy).
      # Needs secrets: SUPABASE_ACCESS_TOKEN, GMAIL_SMTP_USER, GMAIL_SMTP_PASS.
      - name: Wire Gmail confirmation (SMTP + auth URLs)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${GMAIL_SMTP_USER:-}" ] || [ -z "${GMAIL_SMTP_PASS:-}" ]; then
            echo "::notice::Gmail confirmation not wired yet (optional, takes 2 min): add secrets SUPABASE_ACCESS_TOKEN + GMAIL_SMTP_USER + GMAIL_SMTP_PASS - steps in README 'Gmail confirmation emails'."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          PROJECT = "yzcssyebozfkmojqqdhc"
          URL = f"https://api.supabase.com/v1/projects/{PROJECT}/config/auth"
          tok = os.environ["SUPABASE_ACCESS_TOKEN"]
          gmail = os.environ["GMAIL_SMTP_USER"]
          gpas = os.environ["GMAIL_SMTP_PASS"]

          def call(method, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(URL, data=data, method=method, headers={
                  "Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read() or b"{}")
                  except Exception:
                      return e.code, {}

          def scrub(text):
              return str(text).replace(gpas, "***")

          status, cfg = call("GET")
          if status >= 300:
              print(f"::warning::Supabase auth-config GET failed HTTP {status} - is SUPABASE_ACCESS_TOKEN valid and fresh? Create one at https://supabase.com/dashboard/account/tokens")
              sys.exit(0)

          payload = {
              "external_email_enabled": True,
              "mailer_autoconfirm": False,          # Confirm email stays ON
              "smtp_admin_email": gmail,
              "smtp_host": "smtp.gmail.com",
              "smtp_port": "465",  # string per API schema
              "smtp_user": gmail,
              "smtp_pass": gpas,
              "smtp_sender_name": "Crushly",
          }
          if "site_url" in cfg:
              payload["site_url"] = "https://mencrushly.netlify.app"
          if "uri_allow_list" in cfg:
              payload["uri_allow_list"] = "https://mencrushly.netlify.app/**,http://localhost:8081/**"
          elif "additional_redirect_urls" in cfg:
              payload["additional_redirect_urls"] = ["https://mencrushly.netlify.app/**", "http://localhost:8081/**"]

          status, out = call("PATCH", payload)
          if status >= 300:
              print(f"::warning::SMTP config PATCH failed HTTP {status}: {scrub(json.dumps(out)[:400])} - fall back to the dashboard steps in the README.")
              sys.exit(0)

          status, cfg2 = call("GET")
          ok = (cfg2.get("smtp_host") == "smtp.gmail.com" and cfg2.get("mailer_autoconfirm") is False)
          if not ok:
              print("::warning::PATCH succeeded but the config did not stick - check Authentication -> SMTP settings in the Supabase dashboard.")
          else:
              print("::notice::Gmail confirmation wired: smtp.gmail.com:465 sender " + gmail + ", Confirm email ON, Site URL https://mencrushly.netlify.app. Signup + password-reset emails now go out via Gmail.")
              # Brand the confirm-signup email: Crushly logo + OTP code hero (no link).
              try:
                  t_keys = [k for k in cfg2 if k.startswith("mailer_templates") or k.startswith("mailer_subjects")]
                  print(f"::notice::Template API keys seen: {sorted(t_keys)}")
                  if "mailer_templates_confirmation_content" in cfg2:
                      html = open(os.path.join(os.environ["GITHUB_WORKSPACE"], "supabase/email-templates/confirm-signup.html"), encoding="utf-8").read()
                      t_payload = {
                          "mailer_templates_confirmation_content": html,
                          "mailer_subjects_confirmation": "{{ .Token }} is your Crushly code",
                      }
                      t_status, t_out = call("PATCH", t_payload)
                      if t_status < 300:
                          _, cfg3 = call("GET")
                          if "crushly-mark.png" in (cfg3.get("mailer_templates_confirmation_content") or ""):
                              print("::notice::Confirm-signup email template LIVE: Crushly logo + 6-digit code (subject shows the code). Source: supabase/email-templates/confirm-signup.html.")
                          else:
                              print("::warning::Template PATCH returned 2xx but the stored template does not look like ours - check Authentication -> Email Templates.")
                      else:
                          print(f"::warning::Template PATCH failed HTTP {t_status}: {scrub(json.dumps(t_out)[:300])} - paste supabase/email-templates/confirm-signup.html into Authentication -> Email Templates instead.")
                  else:
                      print(f"::warning::No mailer_templates_confirmation_content in auth config - paste supabase/email-templates/confirm-signup.html into Authentication -> Email Templates. Keys: {sorted(t_keys)}")
              except Exception as e:
                  import os, traceback
                  traceback.print_exc()
                  print(f"::warning::Template step crashed: {scrub(repr(e))} | cwd={os.getcwd()} | supabase dir: {os.listdir('supabase') if os.path.isdir('supabase') else 'MISSING'}")
          PY

      # AI profile verification: pushes OPENAI_API_KEY into project secrets and
      # deploys the verify-identity edge function (idempotent; every deploy).
      - name: Deploy AI verification (edge function + key)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::AI verification deploy skipped - add the SUPABASE_ACCESS_TOKEN secret (https://supabase.com/dashboard/account/tokens)."
            exit 0
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            wc=$(curl -s -o /tmp/sec.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/yzcssyebozfkmojqqdhc/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "{\"OPENAI_API_KEY\": \"$OPENAI_API_KEY\"}")
            echo "secret push: HTTP $wc"
            case "$wc" in
              2*) echo "::notice::OPENAI_API_KEY wired into the project - AI verification reviews selfies automatically." ;;
              *) echo "::warning::Could not push OPENAI_API_KEY (HTTP $wc). Add it manually: https://supabase.com/dashboard/project/yzcssyebozfkmojqqdhc/functions/secrets" ;;
            esac
          else
            echo "::notice::No OPENAI_API_KEY secret yet - verification requests queue for manual review until it is added at https://github.com/dyceelvk/Crushly/settings/secrets/actions"
          fi
          echo "--- deploying edge functions ---"
          if out=$(cd "$GITHUB_WORKSPACE" && npx --yes supabase@latest functions deploy verify-identity --project-ref yzcssyebozfkmojqqdhc 2>&1); then
            echo "::notice::Edge function verify-identity deployed - AI verification is live."
            printf '%s\n' "$out" | tail -6
          else
            safe=${out//$OPENAI_API_KEY/***}
            echo "::warning::functions deploy failed: $(printf '%s' "$safe" | tail -c 700 | tr '\n' ' ')"
            printf '%s\n' "$safe" | tail -12
          fi

      - name: Install & test
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:web

      - name: Diagnose Netlify access
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          code=$(curl -s -o /tmp/site.json -w "%{http_code}" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          name=$(jq -r '.name // "??"' /tmp/site.json 2>/dev/null || echo "??")
          echo "Netlify site lookup: HTTP $code (name: $name)"
          case "$code" in
            200)
              echo "::notice::Netlify token can access site '$name'." ;;
            401)
              echo "::error::Netlify rejected NETLIFY_AUTH_TOKEN (401 Unauthorized): the token is invalid, mistyped or revoked. Create a fresh Personal access token at https://app.netlify.com/user/applications (logged in as the account that owns the mencrushly site) and update the secret." ;;
            403)
              echo "::error::NETLIFY_AUTH_TOKEN is valid but has NO access to this site (403 Forbidden) — it was almost certainly created on a different Netlify account/team than the one that owns mencrushly. Log into THAT account (the one showing the mencrushly site), create the token at https://app.netlify.com/user/applications, and update the secret." ;;
            404)
              echo "::error::Site not found (404) — NETLIFY_SITE_ID is wrong. It must be 9524369e-5044-4562-b504-3a62456403e9 (Netlify → Site configuration → General → Site ID)." ;;
            *)
              echo "::error::Unexpected Netlify API response: HTTP $code — $(head -c 300 /tmp/site.json)" ;;
          esac
          [ "$code" = "200" ] || exit 1

          # What is the site actually serving vs our latest commit?
          pub=$(jq -r '.published_deploy.commit_ref // "none"' /tmp/site.json 2>/dev/null)
          pubt=$(jq -r '.published_deploy.title // "?"' /tmp/site.json 2>/dev/null | cut -c1-40)
          pubc=$(jq -r '.published_deploy.created_at // "?"' /tmp/site.json 2>/dev/null)
          head=$(git rev-parse --short=7 HEAD)
          echo "site serves commit: ${pub:0:7} ("$pubt" at $pubc) - our HEAD: $head"
          if [ "${pub:0:7}" != "$head" ]; then
            echo "::notice::LIVE site serves an OLDER deploy (site=${pub:0:7}, HEAD=$head) - if the app looks unchanged: turn ON Netlify auto publishing (Site configuration -> Build & deploy -> Continuous deployment) or give NETLIFY_AUTH_TOKEN the Deploy scope."
          else
            echo "::notice::The live site is serving our latest commit."
          fi

          # Which accounts/roles can this token see? (Developer/Owner deploys, Viewer cannot)
          curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/accounts" \
            | jq -r '.[] | "account: \(.name) (id \(.id)) — role: \(.role_slug // .type_name // "?")"' 2>/dev/null \
            | sed 's/^/::notice::/' || true

          # Write probe: no-op site update (name set to its current value).
          # A read-only token gets 403 here even though GET worked.
          wc=$(curl -s -o /tmp/wprobe.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\": \"$name\"}" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          echo "write probe: HTTP $wc — $(head -c 300 /tmp/wprobe.json)"
          case "$wc" in
            2*)
              echo "::notice::Token CAN write to the site - it is not read-only. If the deploy still fails 403, the missing permission is deploy-specific." ;;
            401|403)
              echo "::error::Token is READ-ONLY (write probe HTTP $wc: $(head -c 300 /tmp/wprobe.json)). Create a NEW Personal access token at https://app.netlify.com/user/applications in the 'Personal access tokens' section (NOT OAuth applications, NOT a scoped/read-only or Team access token), then update the NETLIFY_AUTH_TOKEN secret." ;;
            *)
              echo "::warning::Write probe returned HTTP $wc - $(head -c 200 /tmp/wprobe.json)" ;;
          esac

      # Netlify's git integration deploys this repo on every push (primary channel).
      # This step is the Actions-side deployer; it needs a token with Deploy scope.
      # If the Actions-side deploy can't run (token scope), fall back to triggering
      # a Netlify git build via a build hook so the live site always catches up.
      - name: Trigger Netlify git build (fallback)
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=5" \
            | jq -r '.[] | "recent deploy: \(.state) \(.commit_ref[0:7] // "none") \"\(.title // "" | .[0:30])\" \(.created_at)"' 2>/dev/null \
            | sed 's/^/::notice::/' || true

          # If the newest build failed, pull its log and surface the real error.
          latest=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=1")
          dep_id=$(printf '%s' "$latest" | jq -r '.[0].id // empty')
          dep_state=$(printf '%s' "$latest" | jq -r '.[0].state // empty')
          log_url=$(printf '%s' "$latest" | jq -r '.[0].log_access_address // empty')
          if [ -z "$log_url" ] && [ -n "$dep_id" ]; then
            log_url=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/deploys/$dep_id" | jq -r '.log_access_address // empty')
          fi
          echo "::notice::deploy=$dep_id state=$dep_state log_url_set=$([ -n "$log_url" ] && echo yes || echo no)"
          if [ "$dep_state" = "error" ]; then
            echo "::warning::Latest Netlify build FAILED - full log: https://app.netlify.com/sites/mencrushly/deploys/$dep_id"
            if [ -n "$log_url" ]; then
              curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$log_url" \
                | grep -iE "error|failed|cannot|not found|out of memory|killed|bad option|unsupported|engines" \
                | tail -6 | cut -c1-280 | sed 's/^/::warning::log: /' || true
            fi
          fi

          # Most common cause of sudden build failures: an old default Node.
          # Try to pin Node 22 via the env API (site-level vars override netlify.toml).
          env_code=$(curl -s -o /tmp/envres.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d '{"context":"production","value":"22","scopes":["builds"]}' \
            "https://api.netlify.com/api/v1/accounts/6ac6c7195129a1601843b70a/env/NODE_VERSION")
          echo "::notice::NODE_VERSION pin attempt: HTTP $env_code - $(head -c 120 /tmp/envres.json)"
          hook=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/build_hooks" \
            | jq -r '.[] | select(.title=="ci-trigger") | .url' | head -1)
          if [ -z "$hook" ]; then
            resp=$(curl -s -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" \
              -d '{"branch":"arena/927d4af8-crushly","title":"ci-trigger"}' \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/build_hooks")
            hook=$(printf '%s' "$resp" | jq -r '.url // empty')
          fi
          if [ -n "$hook" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$hook")
            if [ "$code" = "200" ]; then
              echo "::notice::Triggered a Netlify git build of the latest commit - mencrushly.netlify.app updates in a couple of minutes."
            else
              echo "::warning::Build hook trigger returned HTTP $code."
            fi
          else
            echo "::warning::Could not create a Netlify build hook (token scope). Turn ON auto publishing: https://app.netlify.com/sites/mencrushly/configuration/deploys"
          fi

      - name: Deploy to Netlify
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if ! out=$(npx --yes netlify-cli@latest deploy --prod --dir=dist --message="Deploy ${{ github.sha }}" --debug 2>&1); then
            # Mask the token value itself, whatever it looks like.
            safe_out=${out//$NETLIFY_AUTH_TOKEN/***}
            echo "::error::netlify deploy failed: $(printf '%s' "$safe_out" | tail -c 1400 | tr '\n' ' ')"
            printf '%s\n' "$safe_out" | tail -30
            exit 1
          fi
          printf '%s\n' "$out"
