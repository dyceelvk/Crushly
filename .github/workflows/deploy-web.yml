# Builds the Expo web export, proves it contains the code that was just written,
# and publishes it to Vercel when a Vercel token exists.
#
# Netlify was removed on 2026-11-02. It had not deployed anything successfully in
# a long time, and its step failed with exit 127 — `bash build.sh` looked for the
# script inside CrushlyApp/ because of this job's working-directory, while the
# script lives at the repository root. Vercel is where mecrushly.vercel.app is
# served from, so Netlify is no longer a target.
#
# Why this file was rewritten (2026-11-02):
#
#   * It pinned one migration by filename — `20261028000027_load_post.sql` — and
#     that file had been renamed to `...000029_...`. So the `database` job died on
#     `psql: No such file or directory` on every single push, and because `deploy`
#     declared `needs: database`, **the web build was skipped every time**. That
#     is why the live site never changed: it was never deployed at all, not
#     deployed stale.
#   * The database step duplicated `supabase db push` (see db-migrations.yml) by
#     hand-picking one file, which is the fragile half of the duplication.
#   * `VERCEL_TOKEN` is not among this repository's secrets, so the Vercel step
#     could never have succeeded either. `NETLIFY_AUTH_TOKEN` and
#     `NETLIFY_SITE_ID` *are* set.
#
# The database job now calls the real migration workflow instead of naming a
# file, and the deploy job no longer dies with it: a database problem is reported
# by db-migrations.yml, and the web app — which is built from source and talks to
# whatever schema is live — still ships.

name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main, arena/**]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Run database migrations
    uses: ./.github/workflows/db-migrations.yml
    secrets: inherit

  deploy:
    name: Build & deploy web
    # Deliberately not `needs: database`: a migration failure must not be able to
    # keep the web app from shipping. It still *waits* for the database job so a
    # normal push applies the schema first, but it runs even when that job fails,
    # because the failure is already visible in its own run.
    needs: database
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/check-public-build.mjs
          npm run build:web

      - name: Prove the export is the code we just built
        run: |
          set -euo pipefail
          # A deploy that silently ships a cached or empty export is how "no
          # changes were made" happens. Every guard string here is ASCII-only
          # and lives on a surface the app renders today, because a needle the
          # bundler legitimately drops blocks a *good* build: that already
          # happened once with 'In your Circle' and then again with the old
          # Crushes empty-state copy, which 1.0.65 rewrote.
          for needle in \
            'Where a Crush turns into a conversation.' \
            'Somebody will. A complete Space and a fresh Moment help you get noticed.' \
            'Hollop for Android' \
            'Moments disappear after 24 hours.'; do
            if ! grep -rqF "$needle" dist --include='*.js'; then
              echo "::error::The export does not contain '$needle'. Refusing to deploy."
              ls -la dist | head
              exit 1
            fi
          done
          size=$(find dist/_expo/static/js/web -name 'index-*.js' -printf '%s\n' | sort -n | tail -1)
          echo "::notice::Export contains the current surfaces; main bundle is ${size} bytes."

      - name: Publish, then prove the live site is this build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('app.json'))['expo']['version'])")
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            npx --yes vercel@latest deploy --prod --yes \
              --token="$VERCEL_TOKEN" \
              --message="Crushly web ${{ github.sha }}"
          else
            # This repository has no VERCEL_TOKEN, and adding one is not this
            # job's decision to make. Publishing happens through the Vercel
            # integration; what this job owes is the part that was missing for
            # weeks: checking that the live site is actually the build. It used
            # to warn, exit 0 and go green with production a fortnight behind.
            echo "::notice::No VERCEL_TOKEN: assuming the Vercel integration publishes. Verifying the live site below."
          fi
          python3 - "$version" <<'PY'
          import re, sys, time, urllib.request
          version = sys.argv[1]
          for attempt in range(20):
              try:
                  html = urllib.request.urlopen('https://mecrushly.vercel.app', timeout=30).read().decode('utf-8', 'ignore')
                  bundle = re.search(r'/_expo/static/js/web/index-[a-f0-9]+\.js', html)
                  if bundle:
                      js = urllib.request.urlopen('https://mecrushly.vercel.app' + bundle.group(0), timeout=90).read().decode('utf-8', 'ignore')
                      if re.search(r'version[^0-9]{0,12}' + re.escape(version), js):
                          print('::notice::mecrushly.vercel.app is serving ' + version + ' (' + bundle.group(0) + ')')
                          sys.exit(0)
                      print('live bundle is not ' + version + ' yet (attempt ' + str(attempt + 1) + ')')
              except Exception as exc:
                  print('could not read the live site: ' + str(exc))
              time.sleep(15)
          print('::error::mecrushly.vercel.app is not serving ' + version + '. This commit is not shipped until it is.')
          sys.exit(1)
          PY
