name: Build Android test APK
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - 'CrushlyApp/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: CrushlyApp
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate public backend configuration
        run: |
          node --input-type=module <<'JS'
          const url = process.env.EXPO_PUBLIC_SUPABASE_URL;
          const key = process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY;
          if (!url || !/^https:\/\/[^/]+\.supabase\.co\/?$/.test(url) || !key) throw Error('Set the two EXPO_PUBLIC_SUPABASE_* GitHub secrets first.');
          let role;
          try { role = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()).role; } catch {}
          if (key.startsWith('sb_secret_') || role === 'service_role') throw Error('Never bundle a server key. Use publishable/anon.');
          JS
      - run: npm ci --include=dev
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Compile standalone release APK
        run: |
          cd android
          # Expo's generated debug certificate signs this internal test build,
          # NOT a Play Store release. JS is embedded; no Expo Go/Metro required.
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" > "$RUNNER_TEMP/crushly-gradle.log" 2>&1 || {
            tail -n 200 "$RUNNER_TEMP/crushly-gradle.log"
            exit 1
          }
      - name: Package test APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/Crushly-android-test.apk
          sha256sum apk/Crushly-android-test.apk > apk/SHA256SUMS.txt
          echo "Standalone arm64 Android test APK (debug signing certificate; not a store release). Keep both members in the same chat to test voice calls." > apk/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Crushly-Android-test-APK
          path: CrushlyApp/apk/
          retention-days: 14
      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-log
          path: ${{ runner.temp }}/crushly-gradle.log
          retention-days: 3
