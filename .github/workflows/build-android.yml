name: Build Android test APK
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - 'CrushlyApp/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: CrushlyApp
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('CrushlyApp/package-lock.json') }}
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Validate public backend configuration
        run: |
          node --input-type=module <<'JS'
          const url = process.env.EXPO_PUBLIC_SUPABASE_URL;
          const key = process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY;
          if (!url || !/^https:\/\/[^/]+\.supabase\.co\/?$/.test(url) || !key) throw Error('Set the two EXPO_PUBLIC_SUPABASE_* GitHub secrets first.');
          let role;
          try { role = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()).role; } catch {}
          if (key.startsWith('sb_secret_') || role === 'service_role') throw Error('Never bundle a server key. Use publishable/anon.');
          JS
      - run: npm ci --include=dev
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Compile standalone release APK
        run: |
          cd android
          # Expo's generated debug certificate signs this internal test build,
          # NOT a Play Store release. JS is embedded; no Expo Go/Metro required.
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" > "$RUNNER_TEMP/crushly-gradle.log" 2>&1 || {
            tail -n 200 "$RUNNER_TEMP/crushly-gradle.log"
            python3 - <<'PYLOG'
          import os
          lines = open(os.environ['RUNNER_TEMP'] + '/crushly-gradle.log').read().splitlines()
          text = '\n'.join(lines[-25:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PYLOG
            exit 1
          }
      - name: Verify install compatibility
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          python3 - "$apk" <<'PYAPK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              libraries = {abi: {p.split('/')[-1] for p in z.namelist() if p.startswith('lib/' + abi + '/') and p.endswith('.so')} for abi in ('armeabi-v7a', 'arm64-v8a')}
          for abi, files in libraries.items():
              required = {'libreactnative.so', 'libhermes.so', 'libjingle_peerconnection_so.so'}
              missing = required - files
              if missing:
                  raise SystemExit(f'{abi}: missing native libraries {sorted(missing)}')
              print(f'::notice::APK verified: {abi} contains React Native, Hermes and WebRTC ({len(files)} native libraries).')
          if libraries['armeabi-v7a'] != libraries['arm64-v8a']:
              raise SystemExit('Native library sets differ between 32-bit and 64-bit ARM.')
          PYAPK
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" | tee "$RUNNER_TEMP/crushly-apk-compatibility.txt"
          min_sdk=$("$tools/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p")
          [ -n "$min_sdk" ] && [ "$min_sdk" -le 28 ] || { echo "::error::APK requires an Android version newer than the Galaxy A10's original Android 9."; exit 1; }
          summary=$(tr '\n' ' ' < "$RUNNER_TEMP/crushly-apk-compatibility.txt")
          echo "::notice::Signed universal ARM test APK: $summary"
      - name: Package test APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/Crushly-android-test.apk
          cp "$RUNNER_TEMP/crushly-apk-compatibility.txt" apk/COMPATIBILITY.txt
          sha256sum apk/Crushly-android-test.apk > apk/SHA256SUMS.txt
          echo "Standalone 32-bit and 64-bit ARM Android test APK (debug signing certificate; not a store release). Keep both members in the same chat to test voice calls." > apk/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Crushly-Android-test-APK
          path: CrushlyApp/apk/
          retention-days: 14
      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-log
          path: ${{ runner.temp }}/crushly-gradle.log
          retention-days: 3
