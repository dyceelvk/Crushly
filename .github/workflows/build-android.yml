name: Re-walk exact secure Android 1.0.95 emulator candidate
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact previously built test APK
        uses: actions/download-artifact@v4
        with:
          name: Holup-secure-x86-test-only
          run-id: 42750519499
          github-token: ${{ github.token }}
          path: test-apk
      - name: Verify test package and release signer
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs test-apk/app-release.apk > "$RUNNER_TEMP/signature.txt"
          grep -qi 'certificate SHA-256 digest: 7ff4777b984e44d6e31e485a958086e07ed7cd621ef6a822489d0d9cbf271ac5' "$RUNNER_TEMP/signature.txt"
          "$tools/aapt" dump badging test-apk/app-release.apk | grep -q "package: name='app.holup.mobile' versionCode='95' versionName='1.0.95'"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk secure candidate on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HOLUP_TEST_PACKAGE: app.holup.mobile
          CRUSHLY_WALK_EMAIL: ${{ secrets.CRUSHLY_WALK_EMAIL }}
          CRUSHLY_WALK_PASSWORD: ${{ secrets.CRUSHLY_WALK_PASSWORD }}
          CRUSHLY_WALK_OUT: walk
        with:
          api-level: 28
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/android-launch-smoke.py test-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Holup-secure-android-rewalk
          path: walk/
          if-no-files-found: ignore
          retention-days: 2
