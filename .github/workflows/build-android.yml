name: Build Android test APK
on:
  workflow_dispatch:
  # `app/**` is the main line. It was absent, so a release cut from this branch
  # only ever built when somebody remembered to press Run — and the ARENA branch
  # that is the actual release branch got no automatic APK at all. The `app/**`
  # push is what turns "version bumped in app.json" into "phones are offered it".
  push:
    branches: [arena/**, 'app/**']
    paths:
      - 'CrushlyApp/**'
      - '.github/workflows/build-android.yml'
      # The build writes this page itself, with the size and fingerprint of
      # the APK it just published. Without this exclusion that write would
      # start another twenty-minute build, which would publish a second APK at
      # the same version with a different fingerprint, which would rewrite the
      # page again. The page follows a release; it never starts one.
      - '!CrushlyApp/public/download/**'
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: CrushlyApp
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('CrushlyApp/package-lock.json') }}
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: npm ci --include=dev
      - name: Validate public backend configuration
        run: node scripts/check-public-build.mjs
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --no-install
      # Gradle auto-downloads the NDK during configuration. That download
      # occasionally arrives corrupted ("Archive is not a ZIP archive"), which
      # fails the whole build for no reason related to the app. Install it here
      # first, with retries, so a bad download can't waste a 40-minute build.
      # Best effort only: if this can't find the SDK manager it reports the
      # layout and steps aside, because Gradle installs the NDK itself. A
      # helper step must never be the reason a build fails.
      - name: Pre-install the Android NDK (best effort, retries on corrupt download)
        run: |
          set -uo pipefail
          ndk="ndk;27.1.12297006"
          sdk=""
          for cand in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/bin/sdkmanager" \
            "${ANDROID_HOME:-}/tools/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$cand" ]; then sdk="$cand"; break; fi
          done
          if [ -z "$sdk" ]; then
            sdk=$(find /usr/local/lib/android /opt/android "${ANDROID_HOME:-}" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          if [ -z "$sdk" ]; then
            echo "::warning::sdkmanager not found (ANDROID_HOME=${ANDROID_HOME:-unset}). Gradle will install the NDK itself."
            ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head -20 || true
            exit 0
          fi
          echo "::notice::Using sdkmanager at $sdk"
          if "$sdk" --list_installed 2>/dev/null | grep -qF "$ndk"; then
            echo "::notice::$ndk is already installed."
            exit 0
          fi
          yes 2>/dev/null | "$sdk" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if yes 2>/dev/null | "$sdk" --install "$ndk" > "$RUNNER_TEMP/ndk-install.log" 2>&1; then
              echo "::notice::Installed $ndk on attempt $attempt."
              exit 0
            fi
            echo "::warning::NDK install attempt $attempt failed (corrupt download is the usual cause) — retrying in 20s."
            tail -n 5 "$RUNNER_TEMP/ndk-install.log" 2>/dev/null || true
            sleep 20
          done
          echo "::warning::Could not pre-install $ndk after 3 attempts — continuing; Gradle will try itself."
          tail -n 20 "$RUNNER_TEMP/ndk-install.log" 2>/dev/null || true
          exit 0
      - name: Compile standalone release APK
        run: |
          cd android
          # Expo's generated debug certificate signs this internal test build,
          # NOT a Play Store release. JS is embedded; no Expo Go/Metro required.
          #
          # The version code comes from app.json and is what a phone compares
          # against when it asks whether an update exists. It must only ever go
          # up: a reused number makes a build invisible to anyone who already
          # installed it.
          echo "::notice::Building versionCode $(python3 -c "import json; print(json.load(open('../app.json'))['expo']['android']['versionCode'])") from app.json."
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" > "$RUNNER_TEMP/crushly-gradle.log" 2>&1 || {
            tail -n 200 "$RUNNER_TEMP/crushly-gradle.log"
            python3 - <<'PYLOG'
          import os
          lines = open(os.environ['RUNNER_TEMP'] + '/crushly-gradle.log').read().splitlines()
          text = '\n'.join(lines[-25:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PYLOG
            exit 1
          }
      - name: Verify install compatibility
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          python3 - "$apk" <<'PYAPK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              libraries = {abi: {p.split('/')[-1] for p in z.namelist() if p.startswith('lib/' + abi + '/') and p.endswith('.so')} for abi in ('armeabi-v7a', 'arm64-v8a')}
          for abi, files in libraries.items():
              required = {'libreactnative.so', 'libjingle_peerconnection_so.so'}
              missing = required - files
              if not files.intersection({'libhermesvm.so', 'libhermes.so'}):
                  missing.add('Hermes engine (libhermesvm.so / libhermes.so)')
              if missing:
                  raise SystemExit(f'{abi}: missing native libraries {sorted(missing)}')
              print(f'::notice::APK verified: {abi} contains React Native, Hermes and WebRTC ({len(files)} native libraries).')
          if libraries['armeabi-v7a'] != libraries['arm64-v8a']:
              raise SystemExit('Native library sets differ between 32-bit and 64-bit ARM.')
          PYAPK
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" | tee "$RUNNER_TEMP/crushly-apk-compatibility.txt"
          min_sdk=$("$tools/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p")
          [ -n "$min_sdk" ] && [ "$min_sdk" -eq 28 ] || { echo "::error::APK minimum must be Android 9 (API 28)."; exit 1; }
          summary=$(tr '\n' ' ' < "$RUNNER_TEMP/crushly-apk-compatibility.txt")
          echo "::notice::Signed universal ARM test APK: $summary"
      - name: Package test APK
        run: |
          mkdir -p apk
          version=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")
          cp android/app/build/outputs/apk/release/app-release.apk "apk/Crushly-${version}-Android9plus.apk"
          cp "$RUNNER_TEMP/crushly-apk-compatibility.txt" apk/COMPATIBILITY.txt
          sha256sum "apk/Crushly-${version}-Android9plus.apk" > apk/SHA256SUMS.txt
          echo "Standalone Android 9+ test APK for 32-bit and 64-bit ARM phones (debug signing certificate; not a store release). Keep both members in the same chat to test voice calls." > apk/README.txt
      - name: Build Android 9 emulator release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" > "$RUNNER_TEMP/crushly-gradle.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/crushly-gradle.log"; exit 1; }
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 9 cold start and relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          working-directory: CrushlyApp
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 ../.github/scripts/android-launch-smoke.py android/app/build/outputs/apk/release/app-release.apk
      - name: Audit known server secrets in packaged APK
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WEBHOOK_SECRET: ${{ secrets.DIDIT_WEBHOOK_SECRET }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GMAIL_SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")
          python3 ../.github/scripts/audit-apk-secrets.py "apk/Crushly-${version}-Android9plus.apk" apk/SECURITY-CHECK.txt
      - name: Publish the asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")
          tag="android-test-${version}"
          file="Crushly-${version}-Android9plus.apk"
          echo "::notice::Publishing ${file} to ${tag}."
          test -f "apk/${file}" || { echo "::error::apk/${file} is missing."; exit 1; }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease \
              --title "Crushly ${version} — Android 9+ testing" \
              --notes "Early-access testing build, not a production launch. Direct APK: no ZIP or Expo Go required. Android 9+; 32-bit and 64-bit ARM."
          fi
          # The file on the release must be the file this job just built.
          #
          # This used to skip the upload whenever the name already existed, then
          # measure the local file and announce those numbers as if they
          # described what was published. When a previous run had already put an
          # APK at this version, the release kept the old build while /version
          # advertised the new one — a download page confidently offering a file
          # that was a day out of date. Overwrite, then check the result.
          gh release upload "$tag" --clobber \
            "apk/${file}" apk/SHA256SUMS.txt apk/SECURITY-CHECK.txt apk/COMPATIBILITY.txt

          built_bytes=$(wc -c < "apk/${file}")
          built_sha=$(sha256sum "apk/${file}" | cut -d' ' -f1)
          asset_bytes=$(gh release view "$tag" --json assets \
            --jq ".assets[] | select(.name == \"$file\") | .size")
          asset_digest=$(gh release view "$tag" --json assets \
            --jq ".assets[] | select(.name == \"$file\") | .digest" | sed 's/^sha256://')

          if [ "$asset_bytes" != "$built_bytes" ]; then
            echo "::error::${file} on ${tag} is ${asset_bytes} bytes but this build produced ${built_bytes}."
            exit 1
          fi
          if [ -n "$asset_digest" ] && [ "$asset_digest" != "$built_sha" ]; then
            echo "::error::${file} on ${tag} has sha256 ${asset_digest} but this build produced ${built_sha}."
            exit 1
          fi
          echo "::notice::Published ${file} (${built_bytes} bytes, sha256 ${built_sha}) — verified against the release."


      - name: Tell the media Worker which build is current
        id: announce
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")
          file="Crushly-${version}-Android9plus.apk"
          # Measured from the file that was just published, so the download
          # page can tell people exactly what they should be checking.
          bytes=$(wc -c < "apk/${file}")
          sha=$(sha256sum "apk/${file}" | cut -d' ' -f1)
          # The version code is read out of this file, not written by hand:
          # the number a phone compares against has to be the one inside the
          # APK it installed.
          out=$(python3 ../.github/scripts/update-worker-release.py --apk "apk/${file}" --bytes "$bytes" --sha256 "$sha")
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'changed=true'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the release facts
        if: steps.announce.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")
          file="Crushly-${version}-Android9plus.apk"
          bytes=$(wc -c < "apk/${file}")
          sha=$(sha256sum "apk/${file}" | cut -d' ' -f1)
          # The page a non-JavaScript reader keeps must name the build that was
          # just published, not the previous one. The size and fingerprint come
          # from the file on the release, so nobody types them.
          node scripts/write-download-page.mjs --version "$version" --bytes "$bytes" --sha256 "$sha"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../cloudflare/media-worker/src/release.json public/download/index.html
          git commit -m "Offer Android $(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])") to phones that ask"
          # Pushing this file is what redeploys the Worker, so the build that
          # was just published is the one /version points at. The push cannot
          # retrigger this workflow: it only watches CrushlyApp/**.
          #
          # It cannot retrigger the *Worker* deploy either, and that is the
          # bug this comment used to claim the opposite of: a push made with
          # the workflow's own GITHUB_TOKEN does not start workflows. That is
          # why a published 1.0.10 could sit behind a /version answering 1.0.9
          # for hours. The Worker is deployed from this job explicitly below.
          # The branch can move while the emulator boots (~20 minutes), and a
          # rejected push here loses the release facts even though the APK is
          # already published: the Worker keeps answering with the previous
          # version while a newer file sits on the release. That happened, so
          # rebase onto whatever arrived and push again rather than giving up.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              break
            fi
            echo "note: push attempt ${attempt} lost the race; retrying after a rebase."
            sleep $((attempt * 15))
          done
          # Fail loudly if it still has not landed - silent loss is the bug.
          git fetch origin
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/$(git rev-parse --abbrev-ref HEAD))" ]; then
            echo "::error::Could not publish release.json - the Worker will still offer the previous build."
            exit 1
          fi

      # Publishing the APK is only half a release: the file exists, but until
      # the Worker is deployed it keeps answering /version and /apk/latest with
      # the build before this one. The commit above cannot do it — GitHub does
      # not start workflows for a push made with the job's own GITHUB_TOKEN, so
      # `Deploy media Worker` never runs on it. So this job deploys the Worker
      # itself, and then asks it what it thinks the current build is. If the
      # answer is not the build that was just published, the release stops here
      # rather than telling every phone an update that is not there.
      - name: Point the Worker at this build
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so the published APK cannot be offered to phones. Add them under Settings → Secrets and variables → Actions (cloudflare/media-worker/README.md has the steps)."
            exit 1
          fi
          cd ../cloudflare/media-worker
          npx --yes wrangler@4 deploy --config wrangler.toml
          cd -
          # Whatever the Worker says now is what a phone will act on.
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS --max-time 20 https://crushly-media.dyceelvk.workers.dev/version || true)
            served=$(printf '%s' "$body" | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            if [ "$served" = "$version" ]; then
              echo "::notice::The Worker now offers ${version}."
              printf '%s\n' "$body"
              exit 0
            fi
            echo "the Worker still answers version=\"${served}\"; waiting for the deploy to land (attempt ${attempt})."
            sleep 15
          done
          echo "::error::The Worker still does not offer ${version} after deploying. Phones will not see this release."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Crushly-Android-test-APK
          path: CrushlyApp/apk/
          retention-days: 14
      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-log
          path: ${{ runner.temp }}/crushly-gradle.log
          retention-days: 3
