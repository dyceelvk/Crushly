name: Test secure Android launch
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch previously built x86_64 candidate
        uses: actions/download-artifact@v4
        with:
          name: Holup-secure-emulator-only
          path: test-apk
          run-id: 42686725544
          github-token: ${{ github.token }}
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold start on Android 9, without sign-in
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r test-apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n app.holup.mobile/.MainActivity
            sleep 35
            adb shell pidof app.holup.mobile
            adb shell uiautomator dump /sdcard/holup-ui.xml
            adb shell cat /sdcard/holup-ui.xml | grep -q 'package="app.holup.mobile"'
            adb logcat -d -t 2000 > "$RUNNER_TEMP/holup-launch-log.txt"
            if grep -q 'FATAL EXCEPTION' "$RUNNER_TEMP/holup-launch-log.txt"; then echo 'Android fatal exception found'; exit 1; fi
            echo 'Candidate cold start succeeded; signed-in features were not tested.'
