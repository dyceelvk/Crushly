name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Optional completed Android test run to re-walk its exact emulator APK
        required: false
        type: string

jobs:
  app:
    name: Typecheck, test & web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  release-notes:
    name: The offered build says what it changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 1.0.64 was offered to phones under the previous release's sentence: the
      # APK changed, the note under it did not, because release.json carried
      # that field forward and nobody compared it to the version being built.
      # The lookup is by version, so a forgotten entry fails here in seconds
      # instead of after a 40-minute APK build that cannot be announced.
      - run: python3 .github/scripts/test_update_notes.py
      - run: python3 .github/scripts/update_notes.py --check

  media-worker:
    name: Media Worker bundles & config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `deploy --dry-run` needs no Cloudflare credentials: it type-free bundles
      # the Worker and validates wrangler.toml, so a broken config is caught on
      # every push rather than on the first deploy that has secrets set.
      # Warning-only — it is a check, not a gate on anyone's branch.
      - run: npx --yes wrangler deploy --dry-run --outdir worker-out
        working-directory: cloudflare/media-worker
        continue-on-error: true

  backend:
    name: Database migrations & RLS smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pgserver psycopg2-binary
      - run: python supabase/tests/run.py

  verification-browser:
    name: Verification browser regression (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrushlyApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx expo export -p web --output-dir dist --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://verification-test.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: offline-public-key
      - run: npx playwright test --config e2e/verification.config.ts
        env:
          E2E_START_SERVER: '1'
      # The Connections feed, offline: a room you are not in has to be offered
      # inside the feed, with its one door actually on the screen. A discovery
      # card taller than the phone is the bug this catches.
      - run: npx playwright test --config e2e/circles.config.ts
        env:
          E2E_START_SERVER: '1'

      - run: npx playwright test --config e2e/space-search.config.ts
        env:
          E2E_START_SERVER: '1'

  emulator-retry:
    name: Re-walk an identical test APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_run_id != '' && startsWith(github.ref_name, 'verify/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the APK was built from exactly these app sources
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN: ${{ inputs.apk_run_id }}
        run: |
          set -euo pipefail
          [[ "$APK_RUN" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN" --jq .head_sha)
          test "$(git rev-parse "$sha:CrushlyApp")" = "$(git rev-parse "HEAD:CrushlyApp")" || { echo 'App sources differ from the artifact build'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: Android-emulator-test-APK
          path: CrushlyApp/emulator-test
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk Android 9
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CRUSHLY_WALK_EMAIL: ${{ secrets.CRUSHLY_WALK_EMAIL }}
          CRUSHLY_WALK_PASSWORD: ${{ secrets.CRUSHLY_WALK_PASSWORD }}
          CRUSHLY_WALK_OUT: ../walk
        with:
          api-level: 28
          target: default
          arch: x86_64
          working-directory: CrushlyApp
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 ../.github/scripts/android-launch-smoke.py emulator-test/app-release.apk
      - name: Keep the Android walk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-retry-walk
          path: walk/
          if-no-files-found: warn
          retention-days: 7
