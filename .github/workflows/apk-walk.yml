# Walk the built APK on a real Android system image.
#
# The unit tests and the type checker can both pass while the app on a phone is
# wrong — a caption under the tab bar, a link landing on the wrong segment, a
# strip in the wrong order. The web build can be walked headlessly (that is
# what `ci.yml` and the local Playwright pass are for), but the APK is a
# different renderer, so it gets its own walk: boot an emulator, install the
# exact bytes the Worker is serving, sign in, and photograph every surface.
#
# It runs after "Build Android test APK" finishes so the APK it installs is the
# one from that commit, and it verifies the SHA-256 against /version first, so a
# stale download can never be mistaken for the build under test.

name: Walk the Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to walk, e.g. 1.0.28 (blank = read CrushlyApp/app.json)'
        required: false
        default: ''
  workflow_run:
    workflows: ['Build Android test APK']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: apk-walk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    # A cancelled or failed build has nothing worth installing.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CRUSHLY_WALK_EMAIL: ${{ secrets.CRUSHLY_WALK_EMAIL }}
      CRUSHLY_WALK_PASSWORD: ${{ secrets.CRUSHLY_WALK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve the version to install
        id: v
        run: |
          set -euo pipefail
          want="${{ github.event.inputs.version }}"
          if [ -z "$want" ]; then
            want=$(python3 -c "import json;print(json.load(open('CrushlyApp/app.json'))['expo']['version'])")
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

      - name: Download the APK the Worker is serving
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          curl -fsSL https://crushly-media.dyceelvk.workers.dev/version -o version.json
          cat version.json
          url=$(python3 -c "import json;print(json.load(open('version.json'))['apkUrl'])")
          sha=$(python3 -c "import json;print(json.load(open('version.json'))['sha256'])")
          code=$(python3 -c "import json;print(json.load(open('version.json'))['versionCode'])")
          served=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          if [ "$served" != "$v" ]; then
            echo "::error::the Worker serves $served (versionCode $code) but this walk is for $v — the build has not published yet"
            exit 1
          fi
          curl -fsSL "$url" -o crushly.apk
          echo "$sha  crushly.apk" | sha256sum -c -
          echo "APK $v (versionCode $code), $(stat -c%s crushly.apk) bytes, sha256 verified"
          # The APK must still declare what app.json says, or the build is lying.
          BT=$(ls "$ANDROID_HOME/build-tools"/* -d 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ]; then
            "$BT/aapt2" dump badging crushly.apk | head -3 || true
          fi

      - name: Boot the emulator and walk the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -x
            adb install -r crushly.apk
            python3 CrushlyApp/scripts/android-walk.py || true
            adb shell wm size
            adb shell dumpsys package app.crushly | grep -E "versionName|versionCode" | head -2

      - name: Upload the walk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-walk-${{ steps.v.outputs.version }}
          path: |
            walk/
            version.json
          if-no-files-found: warn
          retention-days: 14
