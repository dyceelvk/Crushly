# Deletes Moments that have passed their 24 hours — the row and the stored photo.
#
# Without this, "Moments disappear after 24 hours" was only true on the surface:
# the feed filtered them out, but the row and the photo stayed forever, so any
# link someone had already saved kept working.
#
# The sweep also writes every file it removes into `media_deletions`, and the
# second step below empties that queue: it hands the paths to the media Worker,
# which deletes them from R2 *and* B2. Rows and files therefore go together, for
# expired Moments, for deleted posts and Moments, and for closed accounts — the
# same queue, one drain, no orphans.
#
# Runs hourly and on demand (Actions → Expired content cleanup → Run workflow).
# Needs the same SUPABASE_DB_URL secret as "Deploy database migrations".
#
# Every run is idempotent and bounded: it deletes at most 500 rows per pass, so
# an hour later the next run picks up whatever is left.

name: Expired content cleanup

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Delete expired Moments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Needed for scripts/drain_media_deletions.py, which the second step runs.
      - uses: actions/checkout@v4

      - name: Run the sweep
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set — nothing to clean. Add it under Settings → Secrets and variables → Actions (see .github/workflows/db-migrations.yml)."
            exit 0
          fi

          safe=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#(://[^:/]+):.*@(.*)$#\1:***@\2#')
          echo "::notice::Using SUPABASE_DB_URL (password hidden): $safe"

          # -v ON_ERROR_STOP=1 surfaces SQL errors instead of hiding them behind
          # psql's default "keep going" behaviour.
          # One call sweeps both: Moments (a day) and Vibes (a fortnight), so a
          # new kind of content is never left to rot because nobody remembered
          # to schedule it.
          deleted=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select public.cleanup_expired_media();" | tr -d '[:space:]')
          echo "::notice::Swept expired content: $deleted"

          remaining=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select (select count(*) from public.moments where expires_at <= public.now_ms()) + (select count(*) from public.vibes where expires_at <= public.now_ms());" | tr -d '[:space:]')
          echo "::notice::$remaining expired item(s) still pending (carried to the next run)."

          failed=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from public.media_cleanup_log where not ok;" | tr -d '[:space:]')
          if [ "$failed" != "0" ]; then
            echo "::warning::$failed file deletion(s) failed — check public.media_cleanup_log; the rows are gone but those files may be orphaned."
          fi

      # ---------------------------------------------------------------------
      # Empty the deletion queue.
      #
      # Every deleted post, deleted Moment, expired Moment and closed account
      # writes its file into `media_deletions` inside the transaction that makes
      # the change. This is what actually removes the bytes: the paths go to the
      # media Worker, which clears R2 *and* B2, and only what it confirms is
      # marked done. A failure leaves the row pending, so the next hour tries
      # again — the queue is the promise, and it does not expire.
      #
      # Skipped with a notice when the Worker credentials are absent, because a
      # red X every hour for a missing optional secret trains people to ignore it.
      - name: Delete the files the queue names
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: ${{ vars.MEDIA_WORKER_URL }}
        run: python3 scripts/drain_media_deletions.py
