name: Diagnose Android 11 APK update
on:
  push:
    branches: [arena/**]
    paths:
      - '.github/workflows/diagnose-android-update.yml'
      - '.github/scripts/compare-android-apks.py'
      - '.github/scripts/test-android-update.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download previously installed Android 9+ build
        uses: actions/download-artifact@v4
        with:
          name: Crushly-Android-test-APK
          run-id: 37957580904
          github-token: ${{ github.token }}
          path: apk-check/old
      - name: Download startup-fix build
        uses: actions/download-artifact@v4
        with:
          name: Crushly-Android-test-APK
          run-id: 37960482296
          github-token: ${{ github.token }}
          path: apk-check/new
      - name: Compare exact distributed APKs
        run: python3 .github/scripts/compare-android-apks.py
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test fresh install and update with 32-bit ARM on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/test-android-update.py
      - name: Upload update with verified matching signature
        uses: actions/upload-artifact@v4
        with:
          name: Crushly-compatible-update
          path: apk-check/repaired/*.apk
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-update-diagnostics
          path: apk-check/*-report.txt
          retention-days: 14
