# Recalculates HolUpp Identity for every member, a batch at a time.
#
# Identity is not computed when somebody opens a profile — a page load must never
# wait on scoring, and a scoring failure must never be visible to a member. It is
# computed here, on a schedule, and the profile reads whatever the last good run
# left behind.
#
# The batch is bounded and ordered least-recently-calculated first, so a run that
# is cut short still makes progress and no member is starved. Three runs a day
# against a 500-member batch covers a small platform in an hour and a large one
# steadily; raise the limit as the membership grows.
#
# Hysteresis lives in the database (flip_margin / min_hold_hours), not here. This
# job computes; the database decides whether the published label may move.
#
# Runs every six hours and on demand (Actions → Identity recalculation → Run
# workflow).

name: Identity recalculation

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Members to recalculate this run'
        required: false
        default: '500'

concurrency:
  group: identity-recalc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recalc:
    name: Recalculate identities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recalculate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LIMIT: ${{ inputs.limit || '500' }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set — nothing to recalculate. Add it under Settings → Secrets and variables → Actions (see .github/workflows/db-migrations.yml)."
            exit 0
          fi

          # The kill switch is checked inside the function, so an operator who
          # turns Identity off does not also have to disable this workflow.
          result=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select public.holupp_identity_recalc_all($LIMIT);")
          echo "::notice::Identity recalculation: $result"

          # Health, not accuracy: how many members are classified, and what the
          # spread looks like. Counts only — no member's scores appear here.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select 'calculated=' || count(*)
                || ' classified=' || count(*) filter (where published_identity is not null)
                || ' avg_confidence=' || coalesce(round(avg(confidence), 3), 0)
                || ' oldest=' || coalesce(to_char(to_timestamp(min(computed_at) / 1000.0), 'YYYY-MM-DD HH24:MI'), 'never')
              from public.holupp_identity_scores;"
