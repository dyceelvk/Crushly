name: Review configured Didit workflow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read workflow configuration without exposing credentials
        env:
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key=os.environ.get('DIDIT_API_KEY',''); wf=os.environ.get('DIDIT_WORKFLOW_ID','')
          if not key or not wf:
              print('Didit API key or workflow ID is not configured in Actions'); raise SystemExit(2)
          req=urllib.request.Request('https://verification.didit.me/v3/workflows/'+urllib.parse.quote(wf,safe='')+'/',headers={'x-api-key':key,'Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=15) as res: data=json.load(res)
          except urllib.error.HTTPError as e:
              print('Could not read configured workflow: HTTP',e.code); raise SystemExit(3)
          except Exception:
              print('Could not reach configured workflow'); raise SystemExit(4)
          print('Workflow type:',data.get('workflow_type','unknown'))
          print('Status:',data.get('status','unknown'))
          print('Archived:',data.get('is_archived','unknown'))
          print('Liveness enabled:',data.get('is_liveness_enabled','unknown'))
          print('Face match enabled:',data.get('is_face_match_enabled','unknown'))
          print('Features:',data.get('features','unknown'))
          PY
