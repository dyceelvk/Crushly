name: Diagnose post publishing
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Select the diagnostic
        required: false
        default: post
        type: choice
        options: [post, space]
      orphan_path:
        description: Optional walk-account diagnostic object to clean up
        required: false
        type: string
permissions:
  contents: read
jobs:
  publish-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Make a real short video for the publish test
        if: inputs.scope != 'space'
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=320x240:r=15 -t 1 -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/crushly-publish-test.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1 /tmp/crushly-publish-test.mp4
      - name: Exercise upload, post, options and cleanup
        if: inputs.scope != 'space'
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          WALK_EMAIL: ${{ secrets.CRUSHLY_WALK_EMAIL }}
          WALK_PASSWORD: ${{ secrets.CRUSHLY_WALK_PASSWORD }}
          ORPHAN_PATH: ${{ inputs.orphan_path }}
        run: python3 .github/scripts/post-publish-diagnostic.py
      - name: Check Space banner and search with the walk account
        if: inputs.scope == 'space'
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          WALK_EMAIL: ${{ secrets.CRUSHLY_WALK_EMAIL }}
          WALK_PASSWORD: ${{ secrets.CRUSHLY_WALK_PASSWORD }}
        run: python3 .github/scripts/space-search-diagnostic.py
