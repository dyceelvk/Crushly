# Pushes supabase/migrations to the live Supabase project — no SQL copy-paste.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   Secret name:  SUPABASE_DB_URL
#   Value:        the Postgres connection URI from the project's Connect
#                 dialog (button at the top of any project page) →
#                 "Session pooler" → URI. Replace [YOUR-PASSWORD] with your
#                 database password (Settings → Database → Reset database
#                 password if lost; percent-encode special characters).
#                 Want host *.pooler.supabase.com and port 5432.
#
# Never commit this value or paste it into chat.
#
# Runs before function deployment through deploy-web.yml, or manually from the Actions
# tab ("Run workflow"). seed.sql is deliberately NOT pushed — demo data stays
# out of the live project.

name: Deploy database migrations

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Pre-flight — can we reach the database at all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          # Everything below is scrubbed: the password never reaches the log,
          # only the shape of the string and whatever Postgres complains about.
          safe=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#(://[^:/]+):.*@(.*)$#\1:***@\2#')
          echo "::notice::Connection string (password hidden): $safe"
          out=$(psql "$SUPABASE_DB_URL" -tAc "select current_database(), version();" 2>&1)
          rc=$?
          echo "::notice::psql exit code: $rc"
          echo "::notice::psql said: $(printf '%s' "$out" | sed -E "s#$SUPABASE_DB_URL#***#g" | tr '\n' ' ' | cut -c1-400)"
          if [ "$rc" != "0" ]; then
            echo "::error::Cannot reach the database with this connection string. Fix SUPABASE_DB_URL and re-run."
            exit 1
          fi
          recorded=$(psql "$SUPABASE_DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations;" 2>/dev/null)
          echo "::notice::Migrations already recorded in the database: ${recorded:-unknown}"
          echo "::notice::Migration files in the repository: $(ls supabase/migrations | wc -l)"

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it under Settings → Secrets and variables → Actions (see .github/workflows/db-migrations.yml)."
            exit 1
          fi
          # Diagnostics with the password hidden — these show in run annotations.
          safe=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#(://[^:/]+):.*@(.*)$#\1:***@\2#')
          echo "::notice::Using SUPABASE_DB_URL (password hidden): $safe"
          case "$SUPABASE_DB_URL" in
            *"[YOUR-PASSWORD]"*)
              echo "::error::SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder — replace it with your real database password."
              exit 1 ;;
          esac
          case "$SUPABASE_DB_URL" in
            postgresql://*:6543/*|postgres://*:6543/*)
              echo "::warning::This looks like the Transaction pooler (port 6543). Prefer Session pooler (port 5432) for migrations." ;;
          esac
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*|*localhost*|*127.0.0.1*) : ;;
            *)
              echo "::warning::Host is not the Session pooler (*.pooler.supabase.com). GitHub runners often cannot reach the direct/db.* host (IPv6-only). Use the project's Connect button → Session pooler → URI." ;;
          esac
          # `--include-all` is required, not decorative. The live database is
          # already ahead of three of these files: it recorded a version that
          # lives in no commit (`20261104151119`, see that file for the full
          # story), so the pending files are *older* than the newest recorded
          # migration. Without the flag the CLI stops with "Found local migration
          # files to be inserted before the last migration on remote database"
          # and applies nothing.
          if ! out=$(supabase db push --db-url "$SUPABASE_DB_URL" --include-all 2>&1); then
            safe_out=$(printf '%s' "$out" | sed -E 's#(://[^:/]+):.*@(.*)$#\1:***@\2#' | tr '\n' ' ' | cut -c1-800)
            echo "::error::supabase db push failed: $safe_out"
            printf '%s\n' "$out" | sed -E 's#(://[^:/]+):.*@(.*)$#\1:***@\2#'
            exit 1
          fi
          printf '%s\n' "$out"

      - name: Verify schema landed
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Reality checks against the database itself: the app's core table and
          # the signup trigger (which creates member rows for new accounts)
          # must both exist after a successful push.
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          out=$(psql "$SUPABASE_DB_URL" -tAc "select to_regclass('public.profiles') is not null;")
          echo "profiles table exists: $out"
          if [ "$out" != "t" ]; then
            echo "::error::Migrations reported success but public.profiles is missing — wrong database?"
            exit 1
          fi
          trg=$(psql "$SUPABASE_DB_URL" -tAc "select exists (select 1 from pg_trigger where tgname = 'on_auth_user_created');")
          echo "signup trigger exists: $trg"
          if [ "$trg" != "t" ]; then
            echo "::error::The on_auth_user_created trigger is missing — new signups would not get member rows."
            exit 1
          fi
          demo=$(psql "$SUPABASE_DB_URL" -tAc "select exists (select 1 from public.profiles where is_demo);")
          echo "demo rows present: $demo"
          if [ "$demo" = "t" ]; then
            echo "::error::Demo seed data found in the live database — run: cd supabase && npm run admin -- purge-demo"
            exit 1
          fi

          # The newest migrations are the ones that go quietly missing: a push
          # that stops early still reports success, and the app then calls an
          # RPC the database has never heard of. Check for them by name.
          missing=0
          for fn in react_to_post post_comments_feed comment_on_post delete_post_comment post_engagement; do
            have=$(psql "$SUPABASE_DB_URL" -tAc "select exists (select 1 from pg_proc where proname = '$fn' and pronamespace = 'public'::regnamespace);")
            if [ "$have" != "t" ]; then
              echo "::error::public.$fn is missing — migration 20261010000020 did not land."
              missing=1
            fi
          done

          # The RPCs that shipped broken once, because the migration that writes
          # them was in the repository but never applied: the Circles highlight
          # carousel, the join-request inbox, the Ask-to-join button and the
          # Crushes post feed were all calling functions the database had never
          # heard of, and every one of them failed into silence rather than an
          # error anyone would report. If these are ever missing again, this run
          # says so by name.
          for fn in crush_posts_feed circle_highlights my_circle_requests decide_circle_request request_join_circle circle_request_state flow_ranked_feed; do
            have=$(psql "$SUPABASE_DB_URL" -tAc "select exists (select 1 from pg_proc where proname = '$fn' and pronamespace = 'public'::regnamespace);")
            if [ "$have" != "t" ]; then
              echo "::error::public.$fn is missing — the app calls it and the database cannot answer. Migration 20261104090000 or 20261104140000 did not land."
              missing=1
            fi
          done
          # `vibes.edit` used to be checked here. Vibes is gone — 20261104130000
          # drops the table — so the check now only covers the post side of the
          # same edit feature.
          for col in posts.body posts.edit; do
            table=${col%%.*}
            column=${col##*.}
            have=$(psql "$SUPABASE_DB_URL" -tAc "select exists (select 1 from information_schema.columns where table_schema='public' and table_name='$table' and column_name='$column');")
            if [ "$have" != "t" ]; then
              echo "::error::public.$table.$column is missing — the video-edit migrations did not land."
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            echo "::error::The database is behind the repository. Re-run this workflow; if it keeps failing, check the log above for the first statement that errored."
            exit 1
          fi

          echo "::notice::Database schema is live: profiles, signup trigger, engagement and clip-edit support verified; no demo data."

      - name: The repository and the database agree on the migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # A push can be perfectly green and still leave the two lists
          # disagreeing — that is exactly how three migrations sat in the
          # repository for a day without ever running, while the app shipped
          # features that called the functions they create.
          #
          # Two questions, both answered here:
          #   * is every file in supabase/migrations recorded as applied?
          #   * is every recorded version present as a file?
          #
          # A version in the database with no file is the more dangerous of the
          # two: `supabase db push` then refuses to run at all, so no schema
          # change can ship until somebody notices. That is what this step is
          # for, and it is why 20261104151119_..._picks_of.sql exists.
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client

          ls supabase/migrations \
            | grep -E '^[0-9]{14}_.+\.sql$' \
            | cut -d_ -f1 \
            | sort > /tmp/in_repo.txt

          psql "$SUPABASE_DB_URL" -tAc \
            "select version from supabase_migrations.schema_migrations order by version" \
            | sed '/^$/d' | sort > /tmp/in_db.txt

          echo "::notice::Migration files here: $(wc -l < /tmp/in_repo.txt), recorded in the database: $(wc -l < /tmp/in_db.txt)"

          not_applied=$(comm -23 /tmp/in_repo.txt /tmp/in_db.txt)
          no_file=$(comm -13 /tmp/in_repo.txt /tmp/in_db.txt)

          bad=0
          if [ -n "$not_applied" ]; then
            echo "::error::In the repository but not applied to the database: $(echo $not_applied)"
            echo "These files have never run. Anything the app calls from them does not exist."
            bad=1
          fi
          if [ -n "$no_file" ]; then
            echo "::error::Applied to the database but missing from the repository: $(echo $no_file)"
            echo "supabase db push will refuse to run until a file with each of these versions exists here."
            bad=1
          fi
          if [ "$bad" != "0" ]; then
            exit 1
          fi
          echo "::notice::Migration history matches in both directions."
