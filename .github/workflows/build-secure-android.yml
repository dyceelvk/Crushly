name: Build secure holUpp Android candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: CrushlyApp
    env:
      CI: '1'
      HOLUP_SECURE_ANDROID: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Public Turnstile site key. Blank is safe: the app then sends no captcha
      # token, which is the pre-captcha behaviour, not a broken build.
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --include=dev
      - run: node scripts/check-public-build.mjs && npm run typecheck && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Prepare signing key
        env:
          HOLUP_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.HOLUP_ANDROID_RELEASE_KEY_PASSWORD }}
          HOLUP_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.HOLUP_ANDROID_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOLUP_ANDROID_RELEASE_KEY_PASSWORD" && test -n "$HOLUP_ANDROID_RELEASE_KEYSTORE_B64"
          umask 077
          printf %s "$HOLUP_ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/holup-release.p12"
          echo "HOLUP_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/holup-release.p12" >> "$GITHUB_ENV"
      - name: Build isolated candidate
        env:
          HOLUP_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.HOLUP_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Verify signing identity and package
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          grep -qi 'certificate SHA-256 digest: cda5c0a7ff47e02ecf8dcef9e22869a09dfe8377aeacb86948555fed097d4ee4' "$RUNNER_TEMP/signature.txt"
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='app.holup.mobile'"
          sha256sum "$apk"
      # No server credential may leave in a build a member holds. This runs on
      # the exact file that would be published, before it is published, and it
      # fails the build rather than warn: a leaked key cannot be un-shipped.
      - name: Refuse to publish an APK carrying a server secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WEBHOOK_SECRET: ${{ secrets.DIDIT_WEBHOOK_SECRET }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GMAIL_SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_SAFEGUARD_KEY: ${{ secrets.GROQ_SAFEGUARD_KEY }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 ../.github/scripts/audit-apk-secrets.py android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SECURITY-CHECK.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: holUpp-secure-unreleased-candidate
          path: CrushlyApp/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/holup-release.p12"
