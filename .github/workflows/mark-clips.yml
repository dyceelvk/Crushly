# Produces the marked copy of every clip that does not have one yet.
#
# This is the server half of "save clip to device". The app never re-encodes
# anything: a job downloads the original from the private bucket, burns in the
# holUpp skeleton mark and the creator's handle, appends the 7-second end card,
# uploads the result and records where it went. The copy that plays inside holUpp
# is never touched, and the marked copy is only ever handed out through
# `post_download`, which applies `can_view_post`.
#
# Never in the upload path. Marking a clip means a full ffmpeg transcode, and
# doing that while somebody is uploading would make them wait for it. So the work
# happens here — but it can no longer wait for a human.
#
# It used to be dispatch-only, and that had a consequence nobody had written
# down: post a clip, open the share sheet, and there was **no Save row at all**,
# because the row is only offered when a marked copy exists. The owner reported
# exactly that, twice: once as a missing button, and once as a note saying the
# copy was "on its way", which is not something a member should ever be shown.
#
# So the batch runs on a timer and picks up whatever is missing. Five minutes,
# not thirty: the gap between posting a clip and the copy existing is exactly the
# window in which the share sheet has nothing to offer, and five minutes is the
# shortest interval GitHub Actions will honour.
#
# The schedule is cheap: the first job only asks the database whether anything is
# waiting, and the expensive one (ffmpeg, imageio, the voice) never starts when
# the answer is no. An idle run costs one psql call.
#
# What this does NOT do is guarantee a copy at the instant of posting. That needs
# a transcoder on the publish path — see the note at the bottom of this file.
#
# Secrets used: SUPABASE_DB_URL, B2_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET.
# Nothing sensitive is committed and nothing is echoed.

name: Mark clips for download

on:
  # Every five minutes — the shortest interval Actions allows. The gate below
  # keeps an idle run to one psql call, so the cost of asking is ~15 seconds.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many posts to process in this run'
        required: false
        default: '20'
      post_ids:
        description: 'Specific post ids (comma separated). Empty = whatever is missing a copy.'
        required: false
        default: ''

concurrency:
  group: mark-clips
  cancel-in-progress: false

jobs:
  # Is there anything to do? One psql call, no ffmpeg, no Python packages.
  waiting:
    name: anything waiting?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.check.outputs.count }}
    steps:
      - name: Ask the database
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client
          count=$(psql "$SUPABASE_DB_URL" -tAc "select jsonb_array_length(public.posts_needing_download(50));" | tr -d '[:space:]')
          # A named dispatch is a human saying "these ones", so it is never
          # short-circuited by the queue being empty.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.post_ids }}" ]; then
            count=${{ inputs.limit || 20 }}
          fi
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"
          echo "waiting: ${count:-0}"

  mark:
    name: mark and upload
    needs: waiting
    if: needs.waiting.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg, the drawing library and the voice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg postgresql-client espeak-ng
          python -m pip install --quiet pillow imageio imageio-ffmpeg numpy scipy
          ffmpeg -version | head -1

      - name: Rebuild the brand pieces if they are missing
        working-directory: CrushlyApp
        run: |
          test -f assets/share/holup-skeleton-white.png || python scripts/make-watermark.py
          test -f assets/share/holup-end-sound.wav || python scripts/make-end-sound.py

      - name: Mark the clips
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          LIMIT: ${{ inputs.limit || '20' }}
          POST_IDS: ${{ inputs.post_ids }}
        run: |
          python scripts/mark_pending_clips.py

      - name: Summary
        if: always()
        run: echo "Finished. See the log above for per-post results."

# ---------------------------------------------------------------------------
# If a marked copy must exist *before* a clip goes live
#
# The honest limit of this file: GitHub Actions cannot be woken by a single
# upload, so a clip posted at 10:02 has its copy somewhere before 10:05. Two ways
# to close that gap, in order of how much they cost to build:
#
#   1. Gate the post, don't gate the button. `can_view_post` refuses a clip with
#      no `post_downloads` row, so a clip appears in the feed only once its copy
#      exists. Free, and the wait becomes invisible — but the post is genuinely
#      late by up to five minutes, which is the wrong trade for a drop that
#      thousands of people are waiting for.
#
#   2. Transcode on publish. A small service (Cloudflare Container, Fly, a VPS)
#      that watches for new clips and runs ffmpeg, so marking takes seconds and
#      happens inside the upload flow instead of behind a timer. This is the only
#      design where "it is ready the moment it posts" is true rather than nearly
#      true.
#
# Until one of those exists, the app does not mention the wait at all: the Save
# row is simply absent, and appears when the copy does.
