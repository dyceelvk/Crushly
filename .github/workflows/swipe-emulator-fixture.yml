name: Swipe fixture Android test only
on:
  push:
    branches: [test/holup-swipe-emulator]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://offline-fixture.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: fixture-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrushlyApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and typecheck
        working-directory: CrushlyApp
        run: npm ci --include=dev && npm run typecheck
      - name: Generate isolated Android test app
        working-directory: CrushlyApp
        run: npx expo prebuild --platform android --no-install
      - name: Build emulator fixture (not for release)
        working-directory: CrushlyApp/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native gestures against synthetic data only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          working-directory: CrushlyApp
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n app.holup.swipetest/.MainActivity
            python3 ../.github/scripts/swipe-emulator-fixture.py
            adb logcat -d -t 4000 > "$RUNNER_TEMP/swipe-log.txt"
            if grep -q 'FATAL EXCEPTION' "$RUNNER_TEMP/swipe-log.txt"; then echo 'Android fatal exception found'; exit 1; fi
            echo 'Offline gesture fixture passed; this is NOT a production APK or a signed-in production test.'
      - name: Save synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swipe-fixture-diagnostics
          path: /tmp/holup-swipe-fixture-artifacts/
          if-no-files-found: ignore
          retention-days: 2
