# Puts an already-built, already-tested APK on the update channel.
#
# The build workflow stops short of this on purpose: it refuses to publish a
# debug-signed APK by itself (`Publish the asset` is disabled). But a build that
# nobody can install is not a release either — 1.0.83 through 1.0.87 reached
# phones through this exact path, an APK mirrored to the private bucket that the
# app's own updater downloads from. This makes that step explicit, repeatable and
# verified instead of a manual upload.
#
# It never builds anything. It takes the artifact from a run that already passed
# its checks, refuses it unless the bytes match what the release notes advertise,
# mirrors it, and then asks the *live* Worker to prove it is serving those bytes.
name: Publish Android APK to the update channel
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id whose APK artifact to publish'
        required: true
        type: string
      artifact:
        description: 'Artifact name. Secure builds upload holUpp-secure-unreleased-candidate; the test build uploads Crushly-Android-test-APK.'
        required: false
        type: string
        default: holUpp-secure-unreleased-candidate
      version:
        description: 'Version the app should advertise, e.g. 1.0.95 (must match release.json on main)'
        required: true
        type: string
      sha256:
        description: 'SHA-256 of the APK as recorded in release.json'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # `wrangler r2 ... --remote` in a job with no wrangler project of its own.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Refuse anything that is not the recorded build
        run: |
          set -euo pipefail
          file="holUpp-${{ inputs.version }}-RielOS.apk"
          # A secure build uploads the raw Gradle output; a test build uploads it
          # already renamed. Accept either, and name it here, because the name in
          # the bucket is what /download and /version have to agree on.
          apk=$(find apk -name "$file" | head -1)
          if [ -z "$apk" ]; then
            apk=$(find apk -name 'app-release.apk' | head -1)
          fi
          test -n "$apk" || { echo "::error::no APK in run ${{ inputs.run_id }} (looked for $file and app-release.apk)."; exit 1; }
          if [ "$(basename "$apk")" != "$file" ]; then
            mv "$apk" "apk/$file"
            apk="apk/$file"
          fi
          echo "APK to publish: $apk ($(stat -c %s "$apk") bytes)" 
          got=$(sha256sum "$apk" | cut -d' ' -f1)
          want="${{ inputs.sha256 }}"
          if [ "$got" != "$want" ]; then
            echo "::error::APK is $got but the release advertises $want. Refusing to publish bytes nobody tested."
            exit 1
          fi
          # The channel must already describe this exact build, or the app would
          # download one file and be told about another.
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open('cloudflare/media-worker/src/release.json'))
          v, sha = os.environ['V'], os.environ['SHA']
          if r['version'] != v or r['sha256'] != sha or r['file'] != 'holUpp-%s-RielOS.apk' % v:
              sys.exit('release.json does not describe %s / %s' % (v, sha))
          print('release.json matches:', r['version'], r['bytes'], 'bytes')
          PY
        env:
          V: ${{ inputs.version }}
          SHA: ${{ inputs.sha256 }}
      # The APK goes to Cloudflare R2, in the bucket the Worker's RELEASES binding
      # actually points at (`holupp`), in the same account as the Worker that
      # serves it. A second bucket name here would upload to a place nothing
      # reads. It used to be mirrored to Backblaze B2, where downloads are
      # metered: a day of installs exhausted the allowance and /download answered
      # 503 for hours while /version advertised a build nobody could fetch. R2
      # charges nothing to serve, so the channel cannot be starved by its own
      # traffic.
      - name: Put the APK in the release bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          apk=$(find apk -name "holUpp-${{ inputs.version }}-RielOS.apk" | head -1)
          test -n "$apk"
          # `wrangler` cannot do this job: it authenticates with
          # CLOUDFLARE_API_TOKEN, and that token has no R2 write scope, which is
          # why every release before 1.0.99 had to be uploaded by hand. The R2
          # access key pair is scoped to the one bucket and does exactly this.
          R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
          R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            python3 .github/scripts/r2-releases.py upload \
            "$apk" "android-releases/holUpp-${{ inputs.version }}-RielOS.apk"
          # Read back the object's size from the bucket itself before trusting the
          # Worker's answer: a truncated upload looks exactly like a working one
          # from the outside, and the app refuses a file whose length is wrong.
          R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
          R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            python3 .github/scripts/r2-releases.py fetch \
            "android-releases/holUpp-${{ inputs.version }}-RielOS.apk" /tmp/roundtrip.apk
          got=$(stat -c %s /tmp/roundtrip.apk)
          want=$(python3 -c "import json;print(json.load(open('cloudflare/media-worker/src/release.json'))['bytes'])")
          if [ "$got" != "$want" ]; then
            echo "::error::The bucket holds $got bytes; release.json advertises $want."
            exit 1
          fi
          got_sha=$(sha256sum /tmp/roundtrip.apk | cut -d' ' -f1)
          if [ "$got_sha" != "${{ inputs.sha256 }}" ]; then
            echo "::error::The bucket's copy hashes to $got_sha, not ${{ inputs.sha256 }}."
            exit 1
          fi
          echo "::notice::The release bucket holds ${{ inputs.version }}: $got bytes, SHA-256 matches."
          rm -f /tmp/roundtrip.apk
      # One build in the bucket: the current one.
      #
      # Every older APK is a file nobody can be served — /download only ever
      # answers with the version in release.json — but it still occupies the
      # storage allowance, and an old copy found through a shared link installs
      # a version we have already replaced. So the previous file goes in the
      # same run that publishes the new one, and the step refuses to finish
      # while an older release is still there.
      - name: Leave only the current build in the bucket
        run: |
          set -euo pipefail
          export R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
          export R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
          python3 .github/scripts/r2-releases.py prune
          python3 .github/scripts/r2-releases.py verify
          echo "::notice::One build is on the server, and it is the one release.json describes."

      - name: Make the live Worker prove it serves this build
        run: |
          set -euo pipefail
          want_bytes=$(python3 -c "import json;print(json.load(open('cloudflare/media-worker/src/release.json'))['bytes'])")
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I https://crushly-media.dyceelvk.workers.dev/download || true)
            len=$(curl -sI https://crushly-media.dyceelvk.workers.dev/download | tr -d '\r' | sed -n 's/^content-length: //Ip' | head -1)
            if [ "$code" = "200" ] && [ "$len" = "$want_bytes" ]; then
              echo "::notice::The update channel is serving ${{ inputs.version }}: HTTP 200, $len bytes."
              exit 0
            fi
            sleep 15
          done
          echo "::error::/download did not serve $want_bytes bytes (last: HTTP $code, length ${len:-none})."
          exit 1
