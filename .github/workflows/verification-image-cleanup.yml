name: Remove expired verification images
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      configure_secret:
        description: 'Set up or rotate the protected worker secret'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: holup-verification-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure worker secret in Supabase
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_secret }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLEANUP_SECRET: ${{ secrets.MANUAL_EVIDENCE_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          secret=os.environ.get('CLEANUP_SECRET','')
          token=os.environ.get('SUPABASE_ACCESS_TOKEN','')
          if len(secret)<32 or not token: raise SystemExit('Required deployment secret missing')
          request=urllib.request.Request('https://api.supabase.com/v1/projects/yzcssyebozfkmojqqdhc/secrets',
             data=json.dumps([{'name':'MANUAL_EVIDENCE_CLEANUP_SECRET','value':secret}]).encode(),
             headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(request,timeout=45) as response:
                  if response.status not in (200,201,204): raise SystemExit('Secret configuration failed')
          except urllib.error.HTTPError as e: raise SystemExit('Secret configuration HTTP '+str(e.code))
          print('Worker credential configured')
          PY
      - name: Process protected cleanup batch
        env:
          HOLUP_PROJECT_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          CLEANUP_SECRET: ${{ secrets.MANUAL_EVIDENCE_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          case "$HOLUP_PROJECT_URL" in https://yzcssyebozfkmojqqdhc.supabase.co) ;; *) echo 'Unexpected project URL'; exit 1;; esac
          if [ ${#CLEANUP_SECRET} -lt 32 ]; then echo 'Cleanup credential missing'; exit 1; fi
          response=$(mktemp); trap 'rm -f "$response"' EXIT
          code=$(curl --silent --show-error --max-time 90 -o "$response" -w '%{http_code}' -X POST -H "x-cleanup-secret: $CLEANUP_SECRET" "$HOLUP_PROJECT_URL/functions/v1/manual-evidence-cleanup")
          if [ "$code" != 200 ]; then echo "Cleanup failed: HTTP $code"; exit 1; fi
          python3 - "$response" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: data=json.load(f)
          if not isinstance(data,dict) or data.get('failed')!=0 or not isinstance(data.get('removed'),int): raise SystemExit('Unexpected cleanup result')
          print('Cleanup batch completed; objects removed:',data['removed'])
          PY
