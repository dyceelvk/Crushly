# Deploys the media Worker: the private bucket's only door.
#
# Until every secret below exists, this job prints a warning and stops — it
# never fails the branch, so nothing blocks while the accounts are being set up.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#
#   Secrets:
#     CLOUDFLARE_API_TOKEN           Cloudflare → My Profile → API Tokens →
#                                    Create Custom Token → Permissions:
#                                    Account → Workers Scripts → Edit.
#     B2_KEY_ID                      Backblaze → App Keys → Add a New Application Key
#     B2_APPLICATION_KEY             (shown once, at creation)
#     B2_BUCKET                      the private bucket name, e.g. crushly-media
#     ADMIN_TOKEN                    any long random string. Guards the one
#                                    maintenance call, /admin/lifecycle, which
#                                    puts the retention rules on the bucket.
#
#   Variables:
#     CLOUDFLARE_ACCOUNT_ID          Cloudflare → any domain (or Workers & Pages)
#                                    → Account ID, right-hand column
#
# SUPABASE_URL and SUPABASE_ANON_KEY are reused from the existing
# EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY secrets.
#
# Never commit these values or paste them into chat.

name: Deploy media Worker

on:
  workflow_dispatch:
  # Every push, not just ones touching cloudflare/: a Worker secret only takes
  # effect on a deploy, so this is what re-syncs corrected credentials. The job
  # is ~30s, idempotent, and skips itself when credentials aren't set.
  # `app/**` is included deliberately: the web app and the Worker are deployed
  # from this branch, and while only `main` and `arena/**` were listed a push
  # here silently deployed nothing. A release that publishes an APK while the
  # download page and the Worker that serves it still describe the previous one
  # is exactly the state that costs an hour of "why is it still 1.0.7".
  push:
    branches: [main, 'arena/**', 'app/**']

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      # Read at job level too, so steps can skip themselves when it is unset.
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Report missing credentials
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == '' || env.B2_BUCKET == ''
        run: |
          echo "::warning::Media Worker not deployed yet — credentials missing. Add CLOUDFLARE_API_TOKEN (secret), CLOUDFLARE_ACCOUNT_ID (variable), and B2_KEY_ID / B2_APPLICATION_KEY / B2_BUCKET (secrets) under Settings → Secrets and variables → Actions. Steps are in cloudflare/media-worker/README.md. Nothing else is broken by this."

      - uses: actions/checkout@v4
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.B2_BUCKET != ''

      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.B2_BUCKET != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/media-worker
          command: deploy
          # Names only: the action reads each value from `env` below. Writing
          # `NAME=value` here makes it look for an env var called "NAME=value".
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET
            ADMIN_TOKEN
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      # Retention rules live on the bucket, not in code, so they can drift —
      # a rule somebody changed by hand, or one that never got added. Every
      # deploy puts them back the way they should be.
      #
      # GitHub holds the token and sends it; nobody ever has to read it, type
      # it, or paste it anywhere. Skipped silently when ADMIN_TOKEN is unset.
      - name: Restore the storage retention rules
        if: env.CF_TOKEN != '' && env.ADMIN_TOKEN != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          url="https://crushly-media.dyceelvk.workers.dev/admin/lifecycle"
          code=$(curl -s -o /tmp/lifecycle.json -w '%{http_code}' -X POST "$url" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          if [ "$code" = "200" ]; then
            echo "::notice::Storage retention rules are in place."
            cat /tmp/lifecycle.json
          else
            echo "::warning::Could not set the retention rules (HTTP $code). The app works without them, but Vibes would never expire."
          fi
