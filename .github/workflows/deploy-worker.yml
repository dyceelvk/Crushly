# Deploys the media Worker: the private bucket's only door.
#
# A coordinated release must stop when credentials are missing. The web
# workflow gates database changes on the matching deployed Worker revision.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#
#   Secrets:
#     CLOUDFLARE_API_TOKEN           Cloudflare → My Profile → API Tokens →
#                                    Create Custom Token → Permissions:
#                                    Account → Workers Scripts → Edit.
#     B2_KEY_ID                      Backblaze → App Keys → Add a New Application Key
#     B2_APPLICATION_KEY             (shown once, at creation)
#     B2_BUCKET                      the private bucket name, e.g. crushly-media
#     ADMIN_TOKEN                    any long random string. Guards the one
#                                    maintenance call, /admin/lifecycle, which
#                                    puts the retention rules on the bucket.
#
#   Variables:
#     CLOUDFLARE_ACCOUNT_ID          Cloudflare → any domain (or Workers & Pages)
#                                    → Account ID, right-hand column
#
# SUPABASE_URL and SUPABASE_ANON_KEY are reused from the existing
# EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY secrets.
#
# Never commit these values or paste them into chat.

name: Deploy media Worker

on:
  workflow_dispatch:
  # Every push, not just ones touching cloudflare/: a Worker secret only takes
  # effect on a deploy, so this is what re-syncs corrected credentials. The job
  # is ~30s, idempotent, and skips itself when credentials aren't set.
  push:
    branches: [main, arena/**]

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      # Read at job level too, so steps can skip themselves when it is unset.
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Report missing credentials
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == '' || env.B2_BUCKET == ''
        run: |
          echo "::error::Media Worker not deployed — credentials missing. Add CLOUDFLARE_API_TOKEN (secret), CLOUDFLARE_ACCOUNT_ID (variable), and B2_KEY_ID / B2_APPLICATION_KEY / B2_BUCKET (secrets) under Settings → Secrets and variables → Actions. Steps are in cloudflare/media-worker/README.md. Coordinated release stopped before database changes."
          exit 1

      - uses: actions/checkout@v4
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.B2_BUCKET != ''

      - name: Preflight coordinated release
        id: release-preflight
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          python3 .github/scripts/check-release.py preflight

      - name: Stamp public Worker build revision
        run: printf '{"revision":"%s"}\n' "$GITHUB_SHA" > cloudflare/media-worker/src/deployment.json

      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.B2_BUCKET != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.release-preflight.outputs.account_id }}
          workingDirectory: cloudflare/media-worker
          command: deploy
          # Names only: the action reads each value from `env` below. Writing
          # `NAME=value` here makes it look for an env var called "NAME=value".
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET
            ADMIN_TOKEN
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      # Retention rules live on the bucket, not in code, so they can drift —
      # a rule somebody changed by hand, or one that never got added. Every
      # deploy puts them back the way they should be.
      #
      # GitHub holds the token and sends it; nobody ever has to read it, type
      # it, or paste it anywhere. Skipped silently when ADMIN_TOKEN is unset.
      - name: Restore the storage retention rules
        if: env.CF_TOKEN != '' && env.ADMIN_TOKEN != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          url="https://crushly-media.dyceelvk.workers.dev/admin/lifecycle"
          code=$(curl -s -o /tmp/lifecycle.json -w '%{http_code}' -X POST "$url" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          if [ "$code" = "200" ]; then
            echo "::notice::Storage retention rules are in place."
            cat /tmp/lifecycle.json
          else
            echo "::warning::Could not set the retention rules (HTTP $code). The app works without them, but Vibes would never expire."
          fi

      - name: Verify deployed Worker revision
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.B2_BUCKET != ''
        run: |
          python3 - <<'PY'
          import json, os, time, subprocess, urllib.error
          expected = os.environ['GITHUB_SHA']
          observed = 'unavailable'
          for attempt in range(20):
              try:
                  result = subprocess.run(['curl', '--silent', '--show-error', '--max-time', '15', '--write-out', '\n%{http_code}', 'https://crushly-media.dyceelvk.workers.dev/deployment?release=' + expected], capture_output=True, text=True, timeout=20)
                  body, code = result.stdout.rsplit('\n', 1)
                  if code != '200':
                      observed = 'HTTP ' + code
                  else:
                      observed = str(json.loads(body).get('revision', 'missing'))
                  if observed == expected:
                      print(f'::notice::Cloudflare Worker revision verified: {observed}')
                      break
                  observed = observed if observed == 'development' or len(observed) == 40 or observed.startswith('HTTP ') else 'missing revision'
              except urllib.error.HTTPError as e:
                  observed = 'HTTP ' + str(e.code)
              except Exception as e:
                  observed = type(e).__name__
              if attempt == 19:
                  print(f'::error::Worker verification failed: {observed}; expected {expected}')
                  raise SystemExit(1)
              time.sleep(5)
          PY

      - name: Diagnose Worker verification without exposing configuration
        if: failure() && steps.release-preflight.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.release-preflight.outputs.account_id }}
        run: |
          python3 - <<'PY'
          import os, subprocess, urllib.request
          for path in ['/health', '/version', '/deployment', '/m/photos/0/nonexistent.jpg']:
              result = subprocess.run(['curl', '-s', '--max-time', '20', '-o', '/dev/null', '-w', '%{http_code}', 'https://crushly-media.dyceelvk.workers.dev' + path], capture_output=True, text=True)
              print(f'::notice::Worker probe {path}: HTTP {result.stdout}')
          url = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/workers/scripts/crushly-media'
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'].strip()}), timeout=30) as response:
                  content = response.read(2 * 1024 * 1024)
              found = os.environ['GITHUB_SHA'].encode() in content
              print(f'::notice::Cloudflare stored Worker code contains this release revision: {found}')
          except Exception as error:
              print(f'::warning::Worker code inspection failed ({type(error).__name__})')
          PY
