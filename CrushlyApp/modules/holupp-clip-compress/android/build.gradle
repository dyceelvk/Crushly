plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.holupp'
version = '1.0.0'

android {
  namespace 'app.holupp.clipcompress'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // Media3 Transformer is Java 8+ bytecode and its API is annotated; compiling
    // against it without this produces "cannot access androidx.media3.common.MediaItem".
    minSdk 24
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  /*
   * Media3 rather than ffmpeg-kit, for the same reason the mark module uses it:
   * the platform's own decoder and encoder (MediaCodec), so a clip the phone
   * recorded is re-encoded by hardware instead of by a bundled binary. That is
   * also what lets this module set an exact bitrate and resolution — the old
   * ffmpeg "auto" mode chose both for us, and chose badly: a 1080p clip came
   * out looking worse than a 480p one because the encoder starved.
   *
   * `transformer` is the pipeline; `exoplayer` is needed by Transformer's
   * internals even though nothing here plays a video.
   */
  implementation 'androidx.media3:media3-transformer:1.11.1'
  implementation 'androidx.media3:media3-common:1.11.1'
  implementation 'androidx.media3:media3-effect:1.11.1'
  implementation 'androidx.media3:media3-exoplayer:1.11.1'
}
