# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "crushly"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "exp://127.0.0.1:8081"
additional_redirect_urls = ["http://localhost:8081", "http://localhost:3000", "crushly://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "12MiB"

[realtime]
enabled = true

[inbucket]
enabled = true
port = 54324

# Didit calls this function directly — the X-Signature-V2 HMAC is the auth,
# so JWT verification must stay off. All other functions keep the default
# (member JWT required).
[functions.didit-webhook]
verify_jwt = false
